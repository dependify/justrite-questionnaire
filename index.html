/* ===== Part 3: export, share, coordinator, print, events ===== */
const SESSION_SAVE = { timer: null, saving: false, dirty: false, error: false, savedAt: null };
function fileBase() {
  const codes = selectedSections();
  return `justrite-questionnaire_${codes.join('-') || 'draft'}_${slug(state.respondent.name)}_${todayISO()}`;
}
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function buildPayload(draft) {
  const codes = selectedSections();
  const answers = {};
  codes.forEach((code) => {
    SECTIONS[code].questions.forEach((q) => {
      const a = state.answers[q.id];
      if (a && hasAnswer(q.id)) {
        answers[q.id] = {
          value: Array.isArray(a.value) ? a.value.slice() : (a.value == null ? '' : a.value),
          other: a.other || '',
          note: a.note || '',
          marker: a.marker || '',
          who: a.who || ''
        };
      }
    });
  });
  if (!state.responseId) state.responseId = 'R-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  const hasAll = codes.includes('ALL');
  const hasItd = codes.includes('ITD');
  const payload = {
    type: draft ? 'justrite-questionnaire-draft' : 'justrite-questionnaire-response',
    version: 1,
    app: 'Justrite Stakeholder Questionnaire',
    responseId: state.responseId,
    generatedAt: new Date().toISOString(),
    startedAt: state.startedAt,
    respondent: Object.assign({}, state.respondent),
    sections: codes,
    answers,
    extras: {
      documents: hasAll ? Object.assign({}, state.docs) : {},
      documentNote: hasAll ? state.docNote : '',
      sopOwners: hasAll ? Object.assign({}, state.sopOwners) : {},
      raci: hasAll ? { names: Object.assign({}, state.raci.names), cells: Object.assign({}, state.raci.cells) } : { names: {}, cells: {} },
      table1: hasItd ? clone(state.table1) : {}
    },
    signoff: {
      name: state.signoff.name || state.respondent.name,
      role: state.signoff.role || state.respondent.role,
      date: state.signoff.date || todayISO(),
      confirmed: !!state.signoff.confirmed
    },
    stats: overallStats(),
    contact: CONTACT
  };
  if (draft) {
    payload.current = { section: state.current, index: state.qIndex };
    payload.fromScreen = state.screen;
  } else {
    payload.submittedAt = new Date().toISOString();
  }
  return payload;
}
function downloadDraft() {
  if (EMBEDDED) { showDownloadBlocked(); return; }
  const p = buildPayload(true);
  download(`${fileBase()}_draft.json`, JSON.stringify(p, null, 2), 'application/json');
  toast('Draft downloaded. Resume it any time with “Resume draft”.');
}
function downloadResponse(navigate) {
  if (navigate === undefined) navigate = true;
  if (EMBEDDED) { showDownloadBlocked(); return false; }
  if (overallStats().answered === 0) {
    toast('Answer at least one question before downloading a response.', 'error');
    return false;
  }
  if (!state.signoff.confirmed) toast('Downloaded without the sign-off tick — you can confirm and download again.', 'info');
  const p = buildPayload(false);
  download(`${fileBase()}.json`, JSON.stringify(p, null, 2), 'application/json');
  state.submittedAt = p.submittedAt;
  if (navigate) {
    state.screen = 'sent';
    render();
    window.setTimeout(() => toast('Response file downloaded. Send it on WhatsApp or email.'), 500);
  } else {
    toast('Copy downloaded.');
  }
  return true;
}
function shareFile() {
  if (EMBEDDED) { showDownloadBlocked(); return; }
  if (overallStats().answered === 0) { toast('Answer at least one question first.', 'error'); return; }
  const p = buildPayload(false);
  const file = new File([JSON.stringify(p, null, 2)], `${fileBase()}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    navigator.share({ files: [file], title: 'Justrite questionnaire response', text: 'My completed Justrite Stakeholder Questionnaire response.' })
      .then(() => toast('File shared. If WhatsApp opened, attach the file if it did not.'))
      .catch((err) => { if (err && err.name !== 'AbortError') toast('Sharing was cancelled. Use “Download response file” instead.', 'info'); });
  } else {
    toast('This browser cannot share files directly — downloading instead.', 'info');
    download(`${fileBase()}.json`, JSON.stringify(p, null, 2), 'application/json');
  }
}
function answerLine(q, a) {
  if (!a) return '';
  let text = '';
  if (a.marker) text += `[${MARKER_LABEL[a.marker] || a.marker}] `;
  if (Array.isArray(a.value)) text += a.value.join(', ') + (a.other ? ` — Other: ${a.other}` : '');
  else text += (a.value == null ? '' : String(a.value));
  if (a.note) text += (text ? '\n' : '') + 'Note: ' + a.note;
  if (a.who) text += `\nWho can answer: ${a.who}`;
  return text.trim();
}
function summaryText() {
  const p = buildPayload(false);
  const lines = [];
  lines.push('JUSTRITE PHARMACY — STAKEHOLDER QUESTIONNAIRE');
  lines.push('Prepared by Dependify LLC · October 2026 · Confidential');
  lines.push('='.repeat(64));
  lines.push(`Respondent: ${p.respondent.name || ''}`);
  lines.push(`Role: ${p.respondent.role || ''}`);
  if (p.respondent.store) lines.push(`Store: ${p.respondent.store}`);
  if (p.respondent.phone) lines.push(`Phone / WhatsApp: ${p.respondent.phone}`);
  if (p.respondent.email) lines.push(`Email: ${p.respondent.email}`);
  if (p.respondent.helpedBy) lines.push(`Helped by: ${p.respondent.helpedBy}`);
  lines.push(`Sections: ${p.sections.map((c) => `${c} — ${SECTIONS[c].name}`).join(' | ')}`);
  lines.push(`Completed: ${new Date().toLocaleString('en-GB')}`);
  lines.push(`Answered: ${p.stats.answered} of ${p.stats.total}`);
  lines.push(`Sign-off: ${p.signoff.confirmed ? `Confirmed by ${p.signoff.name} (${p.signoff.role}) on ${p.signoff.date}` : 'NOT CONFIRMED'}`);
  lines.push('');
  p.sections.forEach((code) => {
    const sec = SECTIONS[code];
    lines.push('');
    lines.push('-'.repeat(64));
    lines.push(`${code} — ${sec.name}`);
    lines.push(`Respondents: ${sec.who}`);
    lines.push('-'.repeat(64));
    sec.questions.forEach((q) => {
      const a = p.answers[q.id];
      lines.push('');
      lines.push(`${q.id}${q.pri ? ' · PRIORITY' : ''}`);
      lines.push(`Q: ${q.q}`);
      lines.push(`A: ${a ? answerLine(q, a) : 'Not answered'}`);
    });
    (sec.extras || []).forEach((kind) => {
      if (kind === 'docs') {
        const picked = DATA.documents.filter((d, i) => p.extras.documents[i]);
        lines.push(''); lines.push('Documents offered: ' + (picked.length ? picked.join('; ') : 'none ticked'));
        if (p.extras.documentNote) lines.push('Sharing note: ' + p.extras.documentNote);
      }
      if (kind === 'table1') {
        const filled = Object.keys(p.extras.table1 || {});
        lines.push(''); lines.push(`Store technology table: ${filled.length} of ${DATA.stores.length} stores filled`);
      }
      if (kind === 'sopOwners') {
        const n = Object.keys(p.extras.sopOwners || {}).length;
        lines.push(''); lines.push(`SOP owner confirmations: ${n} changed from the proposal`);
      }
      if (kind === 'raci') {
        lines.push(''); lines.push(`RACI cells set: ${Object.keys((p.extras.raci || {}).cells || {}).length}`);
      }
    });
  });
  lines.push('');
  lines.push('='.repeat(64));
  lines.push(EMBEDDED
    ? 'End of response. Copy this text and send it to ' + CONTACT.email + ' or WhatsApp ' + CONTACT.phone + '.'
    : 'End of response. Send the .json response file to ' + CONTACT.email + ' or WhatsApp ' + CONTACT.phone + '.');
  return lines.join('\n');
}
function downloadText() {
  if (EMBEDDED) { showDownloadBlocked(); return; }
  download(`${fileBase()}.txt`, summaryText(), 'text/plain;charset=utf-8');
  toast('Readable copy downloaded.');
}
function copyAnswers() {
  if (overallStats().answered === 0) { toast('There are no answers to copy yet.', 'error'); return; }
  const txt = summaryText();
  const done = () => toast('Answers copied. Paste them into WhatsApp or email.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);

function addResponses(payloads) {
  const flat = [];
  payloads.forEach((p) => {
    if (p && p.type === 'justrite-questionnaire-batch' && Array.isArray(p.responses)) flat.push.apply(flat, p.responses);
    else flat.push(p);
  });
  let added = 0, updated = 0;
  flat.forEach((p) => {
    if (!p || p.type !== 'justrite-questionnaire-response') return;
    if (!p.sections || !Array.isArray(p.sections) || !p.answers) return;
    const key = p.responseId || `${responseLabel(p)}|${p.submittedAt || p.generatedAt || ''}`;
    const item = Object.assign({}, p, { _key: key });
    const at = state.coordinator.findIndex((x) => x._key === key);
    if (at >= 0) { state.coordinator[at] = item; updated++; }
    else { state.coordinator.push(item); added++; }
  });
  if (added || updated) {
    toast(`${added} response${added === 1 ? '' : 's'} imported${updated ? `, ${updated} updated` : ''}.`, 'success');
    render();
  } else {
    toast('No valid response files found in that selection.', 'error');
  }
}
async function readFiles(fileList, handler) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const results = [];
  for (const file of files) {
    try {
      const text = await file.text();
      results.push(JSON.parse(text));
    } catch (e) {
      toast(`Could not read ${file.name}. Is it a valid response file?`, 'error');
    }
  }
  handler(results);
}

/* ===== voice ===== */
let recognition = null;
function startVoice(btn) {
  if (!SpeechRec) { toast('Voice input is not supported in this browser.', 'error'); return; }
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
    recognition = null;
    if (btn) btn.classList.remove('listening');
    return;
  }
  const ta = $('#q-answer');
  if (!ta) return;
  let rec;
  try { rec = new SpeechRec(); } catch (e) { toast('Voice input is not available here.', 'error'); return; }
  recognition = rec;
  if (btn) btn.classList.add('listening');
  const base = ta.value;
  rec.lang = 'en-GB';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = (ev) => {
    let txt = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    ta.value = (base ? base + ' ' : '') + txt;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = (ev) => {
    if (btn) btn.classList.remove('listening');
    recognition = null;
    toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'
      ? 'Microphone permission is blocked in this preview. Open the form in its own browser tab, or type instead.'
      : 'Voice input stopped (' + ev.error + '). Type instead.', 'error');
  };
  rec.onend = () => { if (btn) btn.classList.remove('listening'); recognition = null; };
  try { rec.start(); } catch (e) {
    if (btn) btn.classList.remove('listening');
    recognition = null;
    toast('Voice input could not start. Type instead.', 'error');
  }
}

function restorePayload(p) {
  state.respondent = Object.assign(blankState().respondent, p.respondent || {});
  state.selected = (p.sections || []).filter((c) => SECTIONS[c]);
  state.answers = {};
  Object.keys(p.answers || {}).forEach((id) => { if (questionById(id)) state.answers[id] = p.answers[id]; });
  const ex = p.extras || {};
  state.docs = ex.documents || {};
  state.docNote = ex.documentNote || '';
  state.sopOwners = ex.sopOwners || {};
  if (ex.raci) {
    if (ex.raci.names) state.raci.names = Object.assign({}, state.raci.names, ex.raci.names);
    if (ex.raci.cells) state.raci.cells = Object.assign({}, ex.raci.cells);
  }
  state.table1 = ex.table1 || {};
  state.signoff = Object.assign(blankState().signoff, p.signoff || {});
  if (!state.signoff.name) state.signoff.name = state.respondent.name || '';
  if (!state.signoff.role) state.signoff.role = state.respondent.role || '';
  state.startedAt = p.startedAt || state.startedAt || new Date().toISOString();
  state.responseId = p.responseId || state.responseId;
  if (p.current && SECTIONS[p.current.section]) {
    state.current = p.current.section;
    state.qIndex = Math.max(0, Math.min(SECTIONS[p.current.section].questions.length - 1, Number(p.current.index) || 0));
    if (p.type === 'justrite-questionnaire-draft' && (p.fromScreen === 'review' || p.fromScreen === 'sectionDone')) state.screen = p.fromScreen;
    else state.screen = p.type === 'justrite-questionnaire-draft' ? 'question' : 'review';
  } else {
    state.current = state.selected[0] || null;
    state.screen = p.type === 'justrite-questionnaire-draft' ? 'intro' : 'review';
  }
  if (!state.selected.length) state.selected = ORDER.filter((c) => state.current === c);
}

    if (p.type === 'justrite-questionnaire-batch') {
      state.screen = 'coordinator';
      addResponses(p.responses || []);
      return;
    }
    restorePayload(p);
    toast(p.type === 'justrite-questionnaire-draft' ? 'Draft restored. Continue where you left off.' : 'Response loaded. You can review or download it again.', 'success');
    render();
  } catch (e) {
    toast('That file could not be read as a questionnaire draft or response.', 'error');
  }
}

/* ===== saved session: registration, autosave, resume ===== */
function updateSyncPill() {
  const el = $('#syncPill');
  if (!el) return;
  if (!API_AVAILABLE || !state.sessionId) { el.hidden = true; return; }
  if (state.savedReceipt) { el.hidden = true; return; }
  el.hidden = false;
  el.setAttribute('aria-label', SESSION_SAVE.saving ? 'Saving progress' : SESSION_SAVE.error ? 'Server unavailable' : 'Progress saved');
  el.title = el.getAttribute('aria-label');
  if (SESSION_SAVE.saving) {
    el.dataset.state = 'saving';
    el.innerHTML = '<i></i>Saving…';
  } else if (SESSION_SAVE.error) {
    el.dataset.state = 'error';
    el.innerHTML = '<i></i>Offline';
  } else if (state.sessionSavedAt) {
    const t = new Date(state.sessionSavedAt);
    el.dataset.state = 'saved';
    el.innerHTML = `<i></i>Saved ${isNaN(t.getTime()) ? '' : t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  } else {
    el.dataset.state = 'saved';
    el.innerHTML = '<i></i>Saved';
  }
}
function sessionDraft() {
  const answers = {};
  selectedSections().forEach((code) => {
    SECTIONS[code].questions.forEach((q) => {
      const a = state.answers[q.id];
      if (a && hasAnswer(q.id)) {
        answers[q.id] = {
          value: Array.isArray(a.value) ? a.value.slice() : (a.value || ''),
          other: a.other || '',
          note: a.note || '',
          marker: a.marker || '',
          who: a.who || ''
        };
      }
    });
  });
  return {
    respondent: state.respondent,
    sections: selectedSections(),
    answers,
    extras: {
      documents: state.docs,
      documentNote: state.docNote,
      sopOwners: state.sopOwners,
      raci: { names: state.raci.names, cells: state.raci.cells },
      table1: state.table1
    },
    current: { section: state.current, index: state.qIndex },
    signoff: state.signoff
  };
}
async function registerSession() {
  if (!API_AVAILABLE) return false;
  try {
    const res = await fetch('/api/sessions', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        respondent: state.respondent,
        sections: selectedSections(),
        answers: {},
        extras: {},
        current: { section: selectedSections()[0] || '', index: 0 },
        signoff: Object.assign({}, state.signoff, { name: state.signoff.name || state.respondent.name, confirmed: !!state.signoff.confirmed })
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Could not start the saved session.');
    state.sessionId = data.session && data.session.id ? data.session.id : null;
    state.sessionSavedAt = data.session && data.session.updated_at ? data.session.updated_at : new Date().toISOString();
    SESSION_SAVE.dirty = false;
    SESSION_SAVE.error = false;
    updateSyncPill();
    if (state.sessionId) toast('Session started. Your progress saves automatically.', 'success');
    return !!state.sessionId;
  } catch (err) {
    toast(err && err.message ? err.message : 'Could not start server saving. You can still continue and download a draft.', 'error');
    return false;
  }
}
async function saveSession(keepalive) {
  if (!API_AVAILABLE || !state.sessionId || state.savedReceipt) return false;
  if (!state.respondent.name || !selectedSections().length) return false;
  if (SESSION_SAVE.saving) { SESSION_SAVE.dirty = true; updateSyncPill(); return false; }
  clearTimeout(SESSION_SAVE.timer);
  SESSION_SAVE.timer = null;
  const body = JSON.stringify(sessionDraft());
  SESSION_SAVE.saving = true;
  SESSION_SAVE.error = false;
  updateSyncPill();
  try {
    const res = await fetch('/api/sessions/current', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body,
      keepalive: !!keepalive
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 409) {
      state.sessionId = null;
      SESSION_SAVE.dirty = false;
      return false;
    }
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Could not save progress.');
    state.sessionSavedAt = data.saved_at || new Date().toISOString();
    SESSION_SAVE.dirty = false;
    SESSION_SAVE.error = false;
    return true;
  } catch (err) {
    SESSION_SAVE.error = true;
    return false;
  } finally {
    SESSION_SAVE.saving = false;
    updateSyncPill();
    if (SESSION_SAVE.dirty) scheduleSessionSave(900);
  }
}
function scheduleSessionSave(delay) {
  if (!API_AVAILABLE || !state.sessionId || state.savedReceipt) return;
  if (['welcome', 'sent', 'saved', 'resume', 'already'].includes(state.screen)) return;
  SESSION_SAVE.dirty = true;
  updateSyncPill();
  clearTimeout(SESSION_SAVE.timer);
  SESSION_SAVE.timer = setTimeout(() => { saveSession(false); }, delay == null ? 1200 : delay);
}
async function checkSession() {
  if (!API_AVAILABLE || !['welcome', 'setup'].includes(state.screen)) return;
  if (overallStats().answered > 0) return;
  try {
    const res = await fetch('/api/sessions/current', { credentials: 'same-origin', headers: { Accept: 'application/json' }, cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const session = data && data.session;
    if (!session) return;
    state.pendingSession = session;
    state.screen = session.status === 'submitted' ? 'already' : 'resume';
    render();
  } catch (err) {
  }
}
function applyPendingSession() {
  const p = state.pendingSession;
  if (!p) return;
  const blank = blankState();
  state.respondent = Object.assign(blank.respondent, p.respondent || {});
  state.selected = (p.sections || []).filter((c) => SECTIONS[c]);
  state.answers = p.answers || {};
  const ex = p.extras || {};
  state.docs = ex.documents || {};
  state.docNote = ex.documentNote || '';
  state.sopOwners = ex.sopOwners || {};
  if (ex.raci) {
    state.raci.names = Object.assign({}, state.raci.names, ex.raci.names || {});
    state.raci.cells = Object.assign({}, ex.raci.cells || {});
  }
  state.table1 = ex.table1 || {};
  state.signoff = Object.assign(blank.signoff, p.signoff || {});
  if (!state.signoff.date) state.signoff.date = todayISO();
  state.current = p.current && SECTIONS[p.current.section] ? p.current.section : (state.selected[0] || null);
  state.qIndex = Math.max(0, Math.min(Number(p.current && p.current.index) || 0, state.current ? SECTIONS[state.current].questions.length - 1 : 0));
  state.sessionId = p.id;
  state.sessionSavedAt = p.updated_at || new Date().toISOString();
  state.startedAt = p.created_at || new Date().toISOString();
  state.resumed = true;
  state.pendingSession = null;
  state.teamLink = false;
  state.screen = 'setup';
  SESSION_SAVE.dirty = false;
  SESSION_SAVE.error = false;
  render();
  toast('Saved session restored. Your answers are back.', 'success');
}
async function closeSession() {
  try {
    await fetch('/api/sessions/close', { method: 'POST', credentials: 'same-origin', headers: { Accept: 'application/json' } });
  } catch (err) {
  }
  state.sessionId = null;
  state.pendingSession = null;
  state.sessionSavedAt = null;
  SESSION_SAVE.dirty = false;
  SESSION_SAVE.error = false;
  clearTimeout(SESSION_SAVE.timer);
  SESSION_SAVE.timer = null;
  updateSyncPill();
}
function copyResumeLink() {
  const input = $('#resumeLink');
  if (!input) return;
  const text = input.value;
  const done = () => toast('Resume link copied.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
async function saveAndShow() {
  if (state.savedReceipt) {
    toast('This response is already saved. Use “Submit another response” to start a new one.');
    return;
  }
  if (API_AVAILABLE && state.sessionId) {
    for (let i = 0; i < 10 && SESSION_SAVE.saving; i++) {
      await new Promise((resolve) => setTimeout(resolve, 200));
    }
    SESSION_SAVE.dirty = true;
    const ok = await saveSession(false);
    if (ok) {
      const link = location.origin + location.pathname;
      openModal(`<h3>Progress saved</h3><p>Your answers are saved to your session on the server. This browser will remember the session for 30 days. Reopen the link on this device to continue; for another device, download a copy.</p><label class="modal-label" for="resumeLink">Link for this device</label><input class="modal-input" id="resumeLink" readonly value="${esc(link)}"><div class="row"><button class="btn ghost" data-action="modal:close">Keep answering</button><button class="btn ghost" data-action="session:download">${icon('download')} Download a copy</button><button class="btn" data-action="session:copy">${icon('copy')} Copy link</button></div>`);
      return;
    }
    openModal(`<h3>Could not reach the server</h3><p>Your answers are still in this tab. Download a copy so you can resume later.</p><div class="row"><button class="btn ghost" data-action="modal:close">Close</button><button class="btn" data-action="session:download">${icon('download')} Download draft</button></div>`);
    return;
  }
  downloadDraft();
  openModal(`<h3>Draft downloaded</h3><p>Keep this file and use “Resume draft” on the form to continue later${API_AVAILABLE ? '' : ' on any device'}.</p><div class="row"><button class="btn" data-action="modal:close">Continue answering</button></div>`);
}

/* ===== server connection, team links, new respondents ===== */
async function checkApi() {
  if (!/^https?:$/.test(location.protocol)) return;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2500);
  try {
    const res = await fetch('/api/health', { headers: { Accept: 'application/json' }, signal: ctrl.signal, cache: 'no-store' });
    const data = await res.json();
    if (res.ok && data && data.ok) {
      API_AVAILABLE = true;
      await checkSession();
      if (state.screen === 'review') render();
    }
  } catch (e) {
  } finally {
    clearTimeout(timer);
  }
}
function initFromUrl() {
  try {
    const params = new URLSearchParams(location.search);
    const raw = (params.get('section') || '').split(',').map((s) => s.trim().toUpperCase()).filter(Boolean);
    const codes = ORDER.filter((c) => raw.includes(c));
    if (codes.length) {
      state.selected = codes;
      state.teamLink = true;
      state.current = codes[0];
      state.qIndex = 0;
      state.screen = 'setup';
    }
    const store = params.get('store');
    if (store && DATA.stores.some((s) => s.name === store)) state.respondent.store = store;
  } catch (e) {
  }
}
function sectionLink(code) {
  const url = new URL(location.href);
  url.search = '';
  url.hash = '';
  url.searchParams.set('section', code);
  if (state.respondent.store) url.searchParams.set('store', state.respondent.store);
  return url.toString();
}
function shareSection(code) {
  code = code || state.current;
  if (!code || !SECTIONS[code]) return;
  const hosted = /^https?:$/.test(location.protocol);
  const link = hosted ? sectionLink(code) : '';
  openModal(`<h3>Share the ${esc(SECTIONS[code].name)} section</h3>
    <p>Send this link to 2 or more staff. Each person enters their own name and submits their own answers for the same section. ${API_AVAILABLE ? 'Responses are saved to the coordinator dashboard.' : 'They can each download their response.'}</p>
    ${hosted ? `<label class="modal-label" for="shareLink">Section link</label><input class="modal-input" id="shareLink" readonly value="${esc(link)}">` : `<div class="callout amber">${icon('alert')} This form is running from a local file, so there is no shareable link yet. Host it on Coolify first.</div>`}
    <div class="row"><button class="btn ghost" data-action="modal:close">Close</button>${hosted ? `<button class="btn" data-action="share:copy">${icon('copy')} Copy link</button>` : ''}</div>`);
}
function copySectionLink() {
  const input = $('#shareLink');
  if (!input) return;
  const text = input.value;
  const done = () => toast('Section link copied. Send it to your colleagues.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
async function submitToServer(btn) {
  if (!API_AVAILABLE) { toast('The server is not connected. Download a copy instead.', 'error'); return; }
  if (overallStats().answered === 0) { toast('Answer at least one question before submitting.', 'error'); return; }
  if (!state.signoff.confirmed || !String(state.signoff.name || '').trim()) {
    toast('Confirm the sign-off and enter your name before submitting.', 'error');
    const so = $('.signoff');
    if (so) so.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const payload = buildPayload(false);
  const original = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = `${icon('clock')} Saving…`; }
  try {
    const res = await fetch('/api/responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'The server could not save this response.');
    state.savedReceipt = {
      id: data.id || '',
      saved_at: data.saved_at || new Date().toISOString(),
      version: data.version || 1,
      created: !!data.created,
      answered: data.answered_count || overallStats().answered
    };
    state.serverPayload = payload;
    state.submittedAt = state.savedReceipt.saved_at;
    state.screen = 'saved';
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
    toast(`Response saved. Receipt ${state.savedReceipt.id}`, 'success');
  } catch (err) {
    toast(err && err.message ? err.message : 'Could not reach the server. Download a copy instead.', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = original; }
  }
}
function askNewRespondent() {
  if (overallStats().answered === 0 && !state.savedReceipt) { resetForNewRespondent(); return; }
  openModal(`<h3>Submit another response?</h3><p>This clears the form for the next staff member.${state.savedReceipt ? ' Your current response is already saved to Dependify.' : ' Any unsaved answers in this tab will be lost.'}</p><div class="row"><button class="btn ghost" data-action="modal:close">Cancel</button><button class="btn" data-action="respondent:new-confirm">Start a new response</button></div>`);
}
async function resetForNewRespondent() {
  await closeSession();
  const keepSections = state.selected.slice();
  const keepStore = state.respondent.store;
  const keepTeam = state.teamLink;
  const fresh = blankState();
  DATA.raci.roles.forEach((role, i) => { fresh.raci.names[i] = role; });
  DATA.raci.activities.forEach((act, ai) => act.values.forEach((val, ri) => { if (val) fresh.raci.cells[ai + '-' + ri] = val; }));
  Object.assign(state, fresh);
  state.selected = keepSections;
  state.respondent.store = keepStore;
  state.teamLink = keepTeam;
  state.current = keepSections[0] || null;
  state.qIndex = 0;
  state.screen = 'setup';
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
  toast('Ready for the next response.');
}

/* ===== dispatcher ===== */
function render() {
  renderTopbar();
  const view = $('#view');
  closeDrawer();
  closeModal();
  switch (state.screen) {
    case 'welcome': view.innerHTML = renderWelcome(); break;
    case 'setup': view.innerHTML = renderSetup(); break;
    case 'intro': view.innerHTML = renderIntro(); break;
    case 'question': view.innerHTML = renderQuestion(); break;
    case 'sectionDone': view.innerHTML = renderSectionDone(); break;
    case 'extra': view.innerHTML = renderExtra(state.extraKind); break;
    case 'review': view.innerHTML = renderReview(); break;
    case 'sent': view.innerHTML = renderSent(); break;
    case 'saved': view.innerHTML = renderSaved(); break;
    case 'resume': view.innerHTML = renderResume(); break;
    case 'already': view.innerHTML = renderAlready(); break;
    case 'coordinator': view.innerHTML = renderCoordinator(); break;
    case 'reference': view.innerHTML = renderReference(); break;
    default: view.innerHTML = renderWelcome();
  }
  $$('.q-textarea:not(.q-note)').forEach((el) => autosize(el));
  updateTopProgress();
  updateSyncPill();
  if (state.sessionId && !state.savedReceipt) scheduleSessionSave(1500);
  if (state.screen === 'question') {
    const t = $('#q-title');
    if (t) t.focus({ preventScroll: true });
  }
  if (state.screen === 'coordinator') {
    const dz = $('#drop');
    if (dz) {
      ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
      ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
      dz.addEventListener('drop', (e) => {
        const files = e.dataTransfer && e.dataTransfer.files;
        readFiles(files, addResponses);
      });
    }
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function go(screen) { state.screen = screen; render(); }

/* ===== events ===== */
function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case 'nav:welcome': state.screen = 'welcome'; render(); break;
    case 'nav:setup': state.screen = 'setup'; render(); break;
    case 'nav:reference': state.refReturn = state.screen; state.screen = 'reference'; render(); break;
    case 'reference:back': state.screen = state.refReturn || 'welcome'; render(); break;
    case 'nav:coordinator': state.screen = 'coordinator'; render(); break;
    case 'welcome:section': {
      const code = el.dataset.code;
      if (code && SECTIONS[code] && !state.selected.includes(code)) state.selected.push(code);
      state.selected = ORDER.filter((c) => state.selected.includes(c));
      state.screen = 'setup'; render(); break;
    }
    case 'draft:download': downloadDraft(); break;
    case 'draft:import': { const f = $('#draftFile'); if (f) f.click(); break; }
    case 'session:save': saveAndShow(); break;
    case 'session:resume': applyPendingSession(); break;
    case 'session:fresh': resetForNewRespondent(); break;
    case 'session:copy': copyResumeLink(); break;
    case 'session:download': downloadDraft(); break;
    case 'setup:begin': beginSetup(); break;
    case 'section:toggle': toggleSection(el.dataset.code, el); break;
    case 'section:start': {
      if (!state.current) break;
      state.qIndex = el.dataset.mode === 'continue' ? firstUnanswered(state.current) : 0;
      state.screen = 'question'; render(); break;
    }
    case 'section:switch': {
      const code = el.dataset.code;
      if (SECTIONS[code]) {
        state.current = code;
        state.qIndex = 0;
        state.screen = 'intro';
        render();
      }
      break;
    }
    case 'group:start': {
      state.qIndex = Number(el.dataset.index) || 0;
      state.screen = 'question'; render(); break;
    }
    case 'q:next': {
      const sec = currentSection();
      if (!sec) break;
      state.visit[sec.questions[state.qIndex].id] = true;
      if (state.qIndex >= sec.questions.length - 1) { state.screen = 'sectionDone'; render(); }
      else { state.qIndex++; render(); }
      break;
    }
    case 'q:back': {
      if (state.editReturn) { state.editReturn = false; state.screen = 'review'; render(); break; }
      if (state.qIndex > 0) { state.qIndex--; render(); }
      else { state.screen = 'intro'; render(); }
      break;
    }
    case 'q:skip': {
      const sec = currentSection();
      if (!sec) break;
      if (state.qIndex >= sec.questions.length - 1) { state.screen = 'sectionDone'; render(); }
      else { state.qIndex++; render(); }
      break;
    }
    case 'q:jump': {
      state.qIndex = Math.max(0, Math.min(Number(el.dataset.index) || 0, (currentSection() || { questions: [] }).questions.length - 1));
      state.screen = 'question'; render(); break;
    }
    case 'q:edit': {
      const qid = el.dataset.qid;
      const code = sectionOf(qid);
      const idx = SECTIONS[code].questions.findIndex((q) => q.id === qid);
      state.editReturn = state.screen === 'review';
      state.current = code;
      state.qIndex = idx < 0 ? 0 : idx;
      state.screen = 'question'; render(); break;
    }
    case 'q:returnReview': state.editReturn = false; state.screen = 'review'; render(); break;
    case 'q:marker': {
      const qid = el.dataset.qid;
      const key = el.dataset.marker;
      const a = state.answers[qid] || (state.answers[qid] = {});
      a.marker = a.marker === key ? '' : key;
      $$(`.assist[data-qid="${qid}"][data-marker]`).forEach((b) => b.setAttribute('aria-pressed', String(a.marker === b.dataset.marker)));
      const box = $('#whoBox');
      if (box) box.classList.toggle('show', a.marker === 'dont-know' || a.marker === 'no-rule');
      const ta = $('#q-answer');
      if (ta) ta.placeholder = a.marker ? 'Optional detail — anything you do know, or who to ask.' : 'Write your answer here — plain and honest.';
      updateTopProgress();
      break;
    }
    case 'q:voice': startVoice(el); break;
    case 'map:open': openMapDrawer(); break;
    case 'map:sections': closeDrawer(); openSectionsDrawer(); break;
    case 'sections:open': openSectionsDrawer(); break;
    case 'drawer:close': closeDrawer(); break;
    case 'modal:close': closeModal(); break;
    case 'drawer:close-setup': closeDrawer(); state.screen = 'setup'; render(); break;
    case 'review:open': state.editReturn = false; state.screen = 'review'; render(); break;
    case 'review:edit': {
      const qid = el.dataset.qid;
      state.editReturn = true;
      state.current = sectionOf(qid);
      state.qIndex = SECTIONS[state.current].questions.findIndex((q) => q.id === qid);
      state.screen = 'question'; render(); break;
    }
    case 'extra:open': {
      state.extraKind = el.dataset.kind;
      state.extraFrom = el.dataset.from || (state.screen === 'review' ? 'review' : 'intro');
      state.preExtraScreen = state.screen;
      state.screen = 'extra'; render(); break;
    }
    case 'extra:back': {
      if (state.extraFrom === 'review') state.screen = 'review';
      else if (state.extraFrom === 'done') state.screen = 'sectionDone';
      else state.screen = 'intro';
      render(); break;
    }
    case 'raci:reset': {
      state.raci.cells = {};
      DATA.raci.activities.forEach((act, ai) => act.values.forEach((val, ri) => { if (val) state.raci.cells[ai + '-' + ri] = val; }));
      render(); break;
    }
    case 'send:json': downloadResponse(); break;
    case 'send:downloadcopy': downloadResponse(false); break;
    case 'send:submit': submitToServer(el); break;
    case 'send:share': shareFile(); break;
    case 'send:text': downloadText(); break;
    case 'send:copy': copyAnswers(); break;
    case 'embed:copy': copyAnswers(); break;
    case 'send:print': printResponse(); break;
    case 'section:share': shareSection(el.dataset.code || state.current); break;
    case 'share:copy': copySectionLink(); break;
    case 'respondent:new': askNewRespondent(); break;
    case 'respondent:new-confirm': closeModal(); resetForNewRespondent(); break;
    case 'send:whatsapp': break;
    case 'send:email': break;
    case 'coord:import': { const f = $('#coordFile'); if (f) f.click(); break; }
    case 'coord:remove': state.coordinator = state.coordinator.filter((r) => r._key !== el.dataset.key); render(); break;
    case 'coord:clear':
      openModal('<h3>Clear all imported responses?</h3><p>They stay in this browser tab only. Export a combined file first if you need them.</p><div class="row"><button class="btn ghost" data-action="modal:close">Cancel</button><button class="btn" data-action="coord:clear-confirm">Clear responses</button></div>');
      break;
    case 'coord:clear-confirm': state.coordinator = []; closeModal(); render(); break;
    case 'coord:exportjson': exportCombined(); break;
    case 'coord:exportcsv': exportCSV(); break;
    default: break;
  }
}

function onInput(e) {
  const t = e.target;
  if (t.matches('[data-answer]')) {
    const id = t.dataset.answer;
    const a = state.answers[id] || (state.answers[id] = {});
    a.value = t.value;
    autosize(t);
    updateTopProgress();
    return;
  }
  if (t.matches('[data-note]')) {
    const a = state.answers[t.dataset.note] || (state.answers[t.dataset.note] = {});
    a.note = t.value;
    return;
  }
  if (t.matches('[data-other]')) {
    const a = state.answers[t.dataset.other] || (state.answers[t.dataset.other] = {});
    a.other = t.value;
    updateTopProgress();
    return;
  }
  if (t.matches('[data-who]')) {
    const a = state.answers[t.dataset.who] || (state.answers[t.dataset.who] = {});
    a.who = t.value;
    return;
  }
  if (t.matches('[data-r]')) {
    state.respondent[t.dataset.r] = t.value;
    return;
  }
  if (t.matches('[data-s]')) {
    if (t.type === 'checkbox') return;
    state.signoff[t.dataset.s] = t.value;
    return;
  }
  if (t.matches('[data-t1]')) {
    const [store, field] = t.dataset.t1.split('::');
    state.table1[store] = state.table1[store] || {};
    state.table1[store][field] = t.value;
    return;
  }
  if (t.matches('[data-sop]')) { state.sopOwners[t.dataset.sop] = t.value; return; }
  if (t.matches('[data-raciname]')) {
    const idx = Number(t.dataset.raciname);
    state.raci.names[idx] = t.value;
    const ths = $$('#raciTable thead th');
    if (ths[idx + 1]) ths[idx + 1].textContent = t.value || DATA.raci.roles[idx];
    return;
  }
  if (t.matches('[data-docnote]')) { state.docNote = t.value; return; }
}

function onChange(e) {
  const t = e.target;
  if (t.id === 'draftFile') {
    if (t.files && t.files[0]) importDraftFile(t.files[0]);
    t.value = '';
    return;
  }
  if (t.id === 'coordFile') {
    readFiles(t.files, addResponses);
    t.value = '';
    return;
  }
  if (t.matches('[data-choice]')) {
    const qid = t.dataset.choice;
    const q = questionById(qid);
    const a = state.answers[qid] || (state.answers[qid] = {});
    if (q.type === 'radio') {
      a.value = t.value;
      $$(`input[name="q-${qid}"]`).forEach((x) => x.closest('.choice').classList.toggle('checked', x.checked));
    } else {
      a.value = $$(`input[name="q-${qid}"]:checked`).map((x) => x.value);
      $$(`input[name="q-${qid}"]`).forEach((x) => x.closest('.choice').classList.toggle('checked', x.checked));
    }
    updateTopProgress();
    return;
  }
  if (t.matches('[data-s="confirmed"]')) {
    state.signoff.confirmed = t.checked;
    const btn = $('#downloadBtn');
    if (btn) btn.classList.toggle('ghost', !t.checked);
    const hint = $('#signHint');
    if (hint) hint.style.display = t.checked ? 'none' : '';
    return;
  }
  if (t.matches('[data-doc]')) {
    state.docs[t.dataset.doc] = t.checked;
    const lbl = t.closest('.doc-check');
    if (lbl) lbl.classList.toggle('on', t.checked);
    return;
  }
  if (t.matches('[data-t1dev]')) {
    const [store, device] = t.dataset.t1dev.split('::');
    state.table1[store] = state.table1[store] || {};
    const dev = Array.isArray(state.table1[store].devices) ? state.table1[store].devices : [];
    state.table1[store].devices = t.checked ? dev.concat(device).filter((v, i, arr) => arr.indexOf(v) === i) : dev.filter((d) => d !== device);
    return;
  }
  if (t.matches('[data-raci]')) { state.raci.cells[t.dataset.raci] = t.value; return; }
  if (t.matches('[data-r="role"]')) {
    const mapped = (ROLE_OPTIONS.find(([label]) => label === t.value) || [])[1];
    if (mapped && SECTIONS[mapped] && !state.teamLink && state.selected.length === 0) {
      state.selected.push(mapped);
      state.selected = ORDER.filter((c) => state.selected.includes(c));
      state.current = mapped;
      const card = $(`[data-action="section:toggle"][data-code="${mapped}"]`);
      if (card) card.setAttribute('aria-checked', 'true');
      updateSetupSummary();
      toast(`Suggested section added: ${SECTIONS[mapped].short}. You can untick it.`, 'info');
    }
    const hint = $('#roleHint');
    if (hint) {
      if (state.teamLink) hint.textContent = 'Team link — keep the section selected above. Your role is only used for follow-up.';
      else if (mapped && !state.selected.includes(mapped)) hint.textContent = `Suggested section: ${SECTIONS[mapped].name}`;
      else hint.textContent = mapped ? `Suggested section: ${SECTIONS[mapped].name}` : '';
    }
    if (state.sessionId) scheduleSessionSave(400);
    return;
  }
  if (t.matches('[data-s]')) { state.signoff[t.dataset.s] = t.type === 'checkbox' ? t.checked : t.value; return; }
}

function onKeydown(e) {
  if (e.key === 'Escape') {
    const drawer = $('#drawer');
    const modal = $('#modal');
    if (drawer && !drawer.hidden) { closeDrawer(); return; }
    if (modal && !modal.hidden) { closeModal(); return; }
  }
  if (state.screen !== 'question') return;
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'textarea' || tag === 'input' || tag === 'select';
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    const next = $('[data-action="q:next"]');
    if (next) next.click();
    return;
  }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); const next = $('[data-action="q:next"]'); if (next) next.click(); }
  if (e.altKey && e.key === 'ArrowLeft' && !inField) { e.preventDefault(); const back = $('[data-action="q:back"]'); if (back) back.click(); }
}

/* ===== init ===== */
document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('keydown', onKeydown);
document.addEventListener('input', () => { if (state.sessionId) scheduleSessionSave(); });
document.addEventListener('change', () => { if (state.sessionId) scheduleSessionSave(); });
window.addEventListener('pagehide', () => { if (state.sessionId && SESSION_SAVE.dirty) saveSession(true); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.sessionId && SESSION_SAVE.dirty) saveSession(true);
});
window.addEventListener('beforeunload', (e) => {
  if (overallStats().answered > 0 && state.screen !== 'sent' && state.screen !== 'saved') {
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
initFromUrl();
render();
checkApi();

})();
</script>
</body>
</html>
