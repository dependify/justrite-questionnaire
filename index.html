<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0A4A45">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://justrite.dependifyllc.com/">
<title>Justrite Stakeholder Questionnaire · Dependify LLC</title>
<meta name="description" content="A guided online questionnaire for the owner, pharmacists, IT, stores and every department of Justrite Pharmacy. Answers become the SOPs, approvals and policies for the website and app.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230C5953'/%3E%3Cpath d='M20 9h8v11h11v8H28v11h-8V28H9v-8h11z' fill='%2318A24A'/%3E%3C/svg%3E">
<style>
/* ============ Justrite Stakeholder Questionnaire — design system ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
:root{
  --teal-950:#052926;
  --teal-900:#073834;
  --teal-800:#0A4A45;
  --teal-700:#0C5953;
  --teal-600:#0E6B64;
  --teal-500:#12857C;
  --mint-50:#F2F9F7;
  --mint-100:#E7F4F0;
  --mint-200:#D2EAE4;
  --navy:#1D293B;
  --ink:#152220;
  --muted:#5B6B67;
  --soft:#7B8A86;
  --line:#DCE7E4;
  --line-strong:#C7D8D3;
  --paper:#F5F8F6;
  --card:#FFFFFF;
  --amber:#8A5A00;
  --amber-bg:#FFF3D6;
  --amber-line:#F0D49A;
  --red:#B42318;
  --red-bg:#FEF0EE;
  --green:#15803D;
  --green-bg:#EAF6EE;
  --radius:18px;
  --shadow:0 1px 2px rgba(10,45,38,.05),0 18px 40px -28px rgba(10,45,38,.35);
  --radius-sm:12px;
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace;
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:15.5px;line-height:1.58;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img,svg{display:block}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--teal-700)}
::selection{background:var(--mint-200);color:var(--teal-900)}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:#fff;padding:10px 16px;border-radius:8px;border:1px solid var(--line)}
.skip:focus{left:8px}
:focus-visible{outline:3px solid rgba(18,133,124,.45);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.narrow{max-width:820px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px;letter-spacing:.02em}
.center{text-align:center}
.hide{display:none !important}
.nowrap{white-space:nowrap}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.topbar-in{max-width:1160px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .logo{width:38px;height:38px;flex:0 0 auto}
.brand-name{display:flex;flex-direction:column;line-height:1.15}
.brand-name b{font-size:14.5px;letter-spacing:-.01em}
.brand-name span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700}
.topbar .spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:8px}
.top-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.top-progress .bar{width:120px;height:6px;border-radius:99px;background:var(--mint-200);overflow:hidden}
.top-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-600),var(--teal-500));border-radius:99px;transition:width .3s ease}
.topbar .linkish{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:650;padding:8px 10px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.topbar .linkish:hover{background:var(--mint-50);color:var(--teal-700)}
.topbar .linkish svg{width:16px;height:16px}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--teal-700);background:var(--mint-50);border:1px solid var(--mint-200);border-radius:999px;padding:4px 8px;font-weight:750;white-space:nowrap;letter-spacing:.02em}
.sync-pill[hidden]{display:none}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--teal-500);flex:0 0 auto}
.sync-pill[data-state="saving"] i{background:#C58A00;animation:pulse 1.2s infinite}
.sync-pill[data-state="error"]{color:#9B2C20;border-color:#F3C7C2;background:#FEF0EE}
.sync-pill[data-state="error"] i{background:#B42318}
@media(max-width:760px){
  .topbar-in{padding:9px 14px;min-height:56px;gap:8px}
  .brand .logo{width:32px;height:32px}
  .brand-name b{font-size:13px}
  .brand-name span{display:none}
  .top-progress .bar{width:70px}
  .top-progress .lbl{display:none}
  .top-actions .linkish{padding:7px}
  .top-actions .linkish span{display:none}
  .sync-pill{font-size:0;gap:0;padding:6px;border-radius:50%}
  .sync-pill i{width:7px;height:7px}
}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border-radius:12px;border:1.5px solid transparent;padding:11px 19px;
  font-size:14px;font-weight:750;letter-spacing:.005em;cursor:pointer;
  text-decoration:none;transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
  background:var(--teal-700);color:#fff;box-shadow:0 1px 2px rgba(10,45,38,.2);
}
.btn:hover{background:var(--teal-800)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--mint-50);border-color:var(--teal-500);color:var(--teal-800)}
.btn.soft{background:var(--mint-100);color:var(--teal-800);border-color:var(--mint-200);box-shadow:none}
.btn.soft:hover{background:var(--mint-200)}
.btn.light{background:#fff;color:var(--teal-900);box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.btn.light:hover{background:#EFF9F6}
.btn.amber{background:#F6C453;color:#3D2A00;box-shadow:none}
.btn.amber:hover{background:#EFB93A}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:14px 24px;font-size:15px;border-radius:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-link{background:none;border:0;color:var(--teal-700);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:5px}
.btn-link:hover{text-decoration:underline}
.btn-link svg{width:14px;height:14px}

/* ============ hero ============ */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:
    radial-gradient(900px 460px at 78% -8%,rgba(18,133,124,.55),transparent 62%),
    radial-gradient(700px 380px at 8% 108%,rgba(13,90,83,.7),transparent 60%),
    linear-gradient(152deg,#0A4A45 0%,#073E3A 52%,#052E2A 100%);
}
.hero .band{position:absolute;top:0;right:0;bottom:0;width:66px;display:flex;flex-direction:column;z-index:2}
.hero .band i{flex:1}
.hero .band i:nth-child(1){background:#0E756E}
.hero .band i:nth-child(2){background:#E9580C}
.hero .band i:nth-child(3){background:#7C3AEC}
.hero .band i:nth-child(4){background:#0891B2}
.hero .band i:nth-child(5){background:#DB2777}
.hero .band i:nth-child(6){background:#16A24A}
.hero .band i:nth-child(7){background:#F6C453}
.hero-in{position:relative;z-index:3;max-width:1160px;margin:0 auto;padding:clamp(34px,6vw,74px) 22px clamp(30px,5vw,58px);padding-right:100px}
.kicker{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:7px 14px;font-size:10.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#CFEDE7;background:rgba(255,255,255,.05)}
.kicker .dot{width:6px;height:6px;border-radius:50%;background:#F6C453;box-shadow:0 0 0 3px rgba(246,196,83,.18)}
.hero h1{
  margin:22px 0 0;font-size:clamp(34px,5.4vw,64px);line-height:1.035;
  letter-spacing:-.038em;font-weight:800;max-width:900px;
}
.hero h1 .y{color:#F6C453}
.hero h1 .m{color:#8FE3D5}
.hero h1 .o{color:#FF9A62}
.hero .lede{margin:20px 0 0;max-width:640px;font-size:clamp(15px,1.5vw,17.5px);line-height:1.62;color:#C7E3DE}
.hero .lede b{color:#fff;font-weight:650}
.hero-meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:28px;font-size:12px;color:#A9CDC7}
.hero-meta b{display:block;color:#fff;font-size:13.5px;font-weight:700;margin-top:2px}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:30px}
.hero-cta .note{font-size:12.5px;color:#9FC7C0;max-width:330px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:clamp(30px,4vw,50px);border-top:1px solid rgba(255,255,255,.16);padding-top:22px;max-width:820px}
.hero-stats>div{padding-right:18px}
.hero-stats>div+div{border-left:1px solid rgba(255,255,255,.14);padding-left:18px}
.hero-stats .n{font-size:clamp(25px,3vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.hero-stats .l{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#9FC7C0;font-weight:700;margin-top:7px}
@media(max-width:820px){
  .hero .band{width:12px;right:0}
  .hero-in{padding-right:32px}
}
@media(max-width:620px){
  .hero-in{padding-left:18px;padding-right:26px}
  .hero-stats{grid-template-columns:repeat(2,1fr);gap:16px 0}
  .hero-stats>div:nth-child(3){border-left:0;padding-left:0}
  .hero-stats>div:nth-child(odd){padding-right:12px}
  .hero-cta .note{max-width:none}
  .hero-cta .btn{width:100%}
}

/* ============ layout bands ============ */
.section-pad{padding:clamp(30px,5vw,62px) 0}
.band-title{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-600);font-weight:800;margin:0 0 8px}
h2.big{margin:0;font-size:clamp(24px,3.2vw,34px);line-height:1.12;letter-spacing:-.028em;font-weight:800}
h3{letter-spacing:-.015em}
.lede{color:var(--muted);font-size:15px;max-width:660px;margin:10px 0 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:clamp(20px,3vw,30px)}
.callout{border:1px solid var(--line);border-left:4px solid var(--teal-600);background:#fff;border-radius:0 14px 14px 0;padding:15px 18px;font-size:13.8px;color:#2F423E}
.callout.amber{border-left-color:#D69E2E;background:#FFFBF1}
.callout.red{border-left-color:var(--red);background:#FFF8F7}
.callout b{color:var(--ink)}
.callout svg{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:3px;color:var(--teal-600)}
.callout.amber svg{color:#B7791F}
.callout.red svg{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--mint-100);color:var(--teal-800);border:1px solid var(--mint-200);white-space:nowrap}
.pill.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.pill.red{background:var(--red-bg);color:var(--red);border-color:#F3C7C2}
.pill.grey{background:#F1F4F3;color:#5B6B67;border-color:#E2E8E6}
.pill.navy{background:#EDF0F4;color:var(--navy);border-color:#DCE2EA}
.pill svg{width:11px;height:11px}
.divider{height:1px;background:var(--line);border:0;margin:20px 0}

/* ============ context / how it works ============ */
.context-strip{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.context-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.context-card .tag{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--teal-600);margin-bottom:8px}
.context-card .tag svg{width:14px;height:14px}
.context-card h3{margin:0 0 6px;font-size:17px}
.context-card p{margin:0;color:var(--muted);font-size:13.8px}
.context-card .mini-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.context-card .mini-list span{font-size:11px;background:var(--mint-50);border:1px solid var(--line);color:#46605A;padding:3px 8px;border-radius:6px}
.quote-card{background:linear-gradient(160deg,var(--teal-900),var(--teal-800));color:#fff;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.quote-card p{margin:0;font-size:16.5px;line-height:1.45;letter-spacing:-.01em}
.quote-card p b{color:#F6C453}
.quote-card .by{font-size:11px;color:#A9CDC7;letter-spacing:.08em;text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:step}
.step{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.step .num{width:30px;height:30px;border-radius:9px;background:var(--mint-100);color:var(--teal-800);font-size:13px;font-weight:800;display:grid;place-items:center;margin-bottom:12px}
.step h4{margin:0 0 5px;font-size:14.5px;letter-spacing:-.01em}
.step p{margin:0;font-size:12.6px;color:var(--muted);line-height:1.5}
@media(max-width:900px){.context-strip{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.steps{grid-template-columns:1fr}}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:16px}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#334641}
.rule svg{width:17px;height:17px;flex:0 0 auto;margin-top:2px;color:var(--teal-600)}
.rule b{color:var(--ink)}
@media(max-width:680px){.rules{grid-template-columns:1fr}}
.section-cloud{display:flex;flex-wrap:wrap;gap:8px}
.section-cloud span{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:650;color:#3B4E49}
.section-cloud i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ============ setup ============ */
.page-head{padding:clamp(24px,4vw,44px) 0 8px}
.page-head h1{margin:0 0 6px;font-size:clamp(27px,4vw,42px);letter-spacing:-.03em;line-height:1.08}
.page-head p{margin:0;color:var(--muted);max-width:680px}
.setup-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start;margin-top:22px}
@media(max-width:940px){.setup-grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,3vw,26px);box-shadow:var(--shadow)}
.panel h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.panel .panel-sub{margin:0 0 18px;color:var(--muted);font-size:12.8px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:11.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#4C615C;margin-bottom:6px}
.field>span .opt{font-weight:600;letter-spacing:0;text-transform:none;color:var(--soft);font-size:11px}
.field>span.role-hint{text-transform:none;letter-spacing:0;font-weight:600;font-size:11.6px;color:var(--teal-700);margin:4px 0 0;line-height:1.4}
.field>span.role-hint:empty{display:none}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line-strong);border-radius:11px;padding:11px 13px;background:#FCFEFD;font-size:14px;transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(18,133,124,.1);outline:none;background:#fff}
.field input::placeholder,.field textarea::placeholder{color:#9AA8A4}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.field-row{grid-template-columns:1fr}}
.req{color:var(--red);font-weight:800}
.sec-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.sec-picker{grid-template-columns:1fr}}
.sec-card{
  --c:#0E6B64;--c-soft:#E7F4F0;
  position:relative;display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 13px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s;
}
.sec-card:hover{border-color:var(--c);box-shadow:0 6px 18px -12px rgba(10,45,38,.4)}
.sec-card .ic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--c-soft);color:var(--c);display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:.02em;font-family:var(--mono)}
.sec-card .tx{min-width:0;flex:1}
.sec-card .tx b{display:block;font-size:13.2px;line-height:1.25;letter-spacing:-.005em}
.sec-card .tx small{display:block;color:var(--muted);font-size:11.3px;margin-top:3px;line-height:1.4}
.sec-card .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:0 0 auto;margin-top:1px;color:#fff;background:#fff}
.sec-card .tick svg{width:12px;height:12px;opacity:0}
.sec-card[aria-checked="true"]{border-color:var(--c);background:linear-gradient(180deg,#fff,var(--c-soft));box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 12%,transparent)}
.sec-card[aria-checked="true"] .tick{background:var(--c);border-color:var(--c)}
.sec-card[aria-checked="true"] .tick svg{opacity:1}
.sec-card.project-wide{background:#FBFCFD;border-style:dashed}
.sec-card.project-wide[aria-checked="true"]{border-style:solid}
.setup-summary{position:sticky;bottom:12px;margin-top:18px;background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 18px 40px -20px rgba(10,20,30,.6);z-index:20}
.setup-summary .nums{font-size:12.5px;color:#C6D2DF;line-height:1.4}
.setup-summary .nums b{color:#fff}
.setup-summary .spacer{flex:1}
.setup-summary .err{color:#FFC9C0;font-size:12px;font-weight:650}
.team-banner{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(180deg,#F4FBF8,#EAF6F2);border:1px solid var(--mint-200);border-radius:14px;padding:12px 15px;margin:0 0 16px;font-size:12.8px;color:#34514A;line-height:1.5}
.team-banner>svg{width:18px;height:18px;color:var(--teal-600);flex:0 0 auto;margin-top:1px}
.team-banner b{display:block;font-size:13px;color:var(--teal-900);margin-bottom:2px;letter-spacing:-.005em}
.resume-banner{display:flex;gap:11px;align-items:center;background:#F0FAF5;border:1px solid #C9E8D9;border-radius:14px;padding:12px 15px;margin:0 0 16px;font-size:12.8px;color:#2F5047;line-height:1.5}
.resume-banner>svg{width:18px;height:18px;color:var(--teal-600);flex:0 0 auto}
.resume-banner>div{flex:1;min-width:0}
.resume-banner b{display:block;font-size:13px;color:var(--teal-900);margin-bottom:2px}
.resume-banner .btn{flex:0 0 auto}
@media(max-width:640px){.resume-banner{flex-wrap:wrap}.resume-banner .btn{width:100%}}
@media(max-width:640px){.setup-summary{position:fixed;left:10px;right:10px;bottom:10px;margin:0;padding:11px 12px}.setup-summary .btn{width:100%}.setup-summary .nums{width:100%}}
.role-hint{margin-top:4px;font-size:11.6px;color:var(--teal-700);display:flex;align-items:center;gap:6px}
.role-hint svg{width:13px;height:13px}

/* ============ intro ============ */
.section-hero{--c:#0E6B64;--c-soft:#E7F4F0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.section-hero .stripe{height:6px;background:var(--c)}
.section-hero .body{padding:clamp(22px,4vw,34px)}
.section-hero .code{display:inline-flex;align-items:center;gap:8px;background:var(--c-soft);color:var(--c);border-radius:999px;padding:5px 11px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.section-hero h1{margin:14px 0 8px;font-size:clamp(26px,4vw,40px);line-height:1.08;letter-spacing:-.03em}
.section-hero .who{margin:0;color:var(--muted);font-size:13.8px;display:flex;align-items:flex-start;gap:8px}
.section-hero .who svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--c)}
.section-hero .blurb{margin:16px 0 0;font-size:15px;color:#334641;max-width:700px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.intro-stat{background:var(--mint-50);border:1px solid var(--line);border-radius:11px;padding:9px 13px;min-width:96px}
.intro-stat b{display:block;font-size:18px;line-height:1.1;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.intro-stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.intro-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.share-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.share-row .tiny{max-width:520px;line-height:1.45}
.sop-panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.sop-panel h3{margin:0 0 4px;font-size:15.5px}
.sop-panel p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.sop-chips{display:flex;flex-wrap:wrap;gap:7px}
.sop-chip{display:inline-flex;align-items:center;gap:6px;background:#F7FAF9;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.8px;color:#3B4E49}
.sop-chip svg{width:12px;height:12px;color:var(--c)}
.group-list{display:grid;gap:2px;margin-top:14px}
.group-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.group-row:hover{background:var(--mint-50)}
.group-row .n{width:24px;height:24px;border-radius:7px;background:var(--mint-100);color:var(--teal-800);font-size:10px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;font-family:var(--mono)}
.group-row .t{font-size:13px;font-weight:650;flex:1}
.group-row .c{font-size:11px;color:var(--soft)}
.group-row svg{width:14px;height:14px;color:var(--soft)}
.extra-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
@media(max-width:820px){.extra-cards{grid-template-columns:1fr}}
.extra-card{background:#fff;border:1px dashed var(--line-strong);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.extra-card:hover{border-color:var(--teal-500);box-shadow:var(--shadow)}
.extra-card b{font-size:13.5px}
.extra-card span{font-size:11.8px;color:var(--muted);line-height:1.45}
.extra-card .tag{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-600);font-weight:800}

/* ============ question flow ============ */
.q-layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:26px;align-items:start;padding:24px 0 90px}
@media(max-width:1020px){.q-layout{grid-template-columns:1fr;padding-top:14px}}
.q-side{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
@media(max-width:1020px){.q-side{display:none}}
.q-side-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.q-side-card .side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.q-side-card .side-head b{font-size:12px;letter-spacing:.02em}
.q-side-card .side-head span{font-size:10.5px;color:var(--soft)}
.q-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.q-dot{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:#F7FAF9;font-size:9.5px;font-weight:750;color:#81908C;display:grid;place-items:center;cursor:pointer;padding:0;font-family:var(--mono);transition:background .1s,border-color .1s}
.q-dot:hover{border-color:var(--teal-500)}
.q-dot.done{background:var(--mint-200);border-color:#B6D9D1;color:var(--teal-900)}
.q-dot.mark{background:var(--amber-bg);border-color:var(--amber-line);color:#8A5A00}
.q-dot.cur{outline:2px solid var(--teal-600);outline-offset:1px;background:#fff;color:var(--teal-900)}
.side-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:9.8px;color:var(--soft)}
.side-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
.side-sections{display:grid;gap:5px}
.side-sec{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:none;border:0;text-align:left;cursor:pointer;font-size:11.8px;color:#43554F}
.side-sec:hover{background:var(--mint-50)}
.side-sec.active{background:var(--mint-100);color:var(--teal-900);font-weight:700}
.side-sec .d{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.side-sec .pct{margin-left:auto;font-size:9.8px;color:var(--soft);font-variant-numeric:tabular-nums}
.q-main{min-width:0;--c:#0E6B64;--c-soft:#E7F4F0;--c-15:rgba(14,107,100,.14)}
.q-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.q-top{padding:clamp(20px,3vw,32px) clamp(20px,3.4vw,36px) 0}
.q-eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--soft);font-weight:750}
.q-eyebrow .g{color:#5E736D}
.q-eyebrow .sep{width:3px;height:3px;border-radius:50%;background:#B9C8C4}
.q-id{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;background:#F1F5F4;border:1px solid var(--line);color:#4F635D;border-radius:6px;padding:3px 6px;text-transform:none}
.q-pri{display:inline-flex;align-items:center;gap:4px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:999px;padding:2px 7px 2px 5px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.q-pri svg{width:10px;height:10px}
.q-title{margin:14px 0 0;font-size:clamp(21px,2.7vw,29px);line-height:1.28;letter-spacing:-.022em;font-weight:750;color:#14231F;outline:none}
.q-hint{margin:14px 0 0;border-left:3px solid var(--c);background:var(--c-soft);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.8px;color:#3E544E;line-height:1.55}
.q-hint b{font-weight:750;color:#2A3E38}
.q-answer{padding:18px clamp(20px,3.4vw,36px) 22px}
.q-textarea{width:100%;min-height:148px;border:1.5px solid var(--line-strong);border-radius:14px;padding:15px 16px;background:#FCFEFD;font-size:15px;line-height:1.6;resize:none;transition:border-color .15s,box-shadow .15s;overflow:hidden}
.q-textarea:focus{border-color:var(--c);box-shadow:0 0 0 4px var(--c-15);outline:none;background:#fff}
.q-textarea::placeholder{color:#9AA8A4}
.q-assist{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:12px}
.q-assist .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:750;margin-right:2px}
.assist{border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:650;color:#54665F;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.assist:hover{border-color:var(--c);color:var(--c)}
.assist svg{width:12px;height:12px}
.assist[aria-pressed="true"]{background:#FFF8E8;border-color:#E6C171;color:#7A5000}
.assist.voice{margin-left:auto;border-style:dashed}
.assist.voice.listening{background:#FEF0EE;border-color:#E9A8A0;color:#9B2C20;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,.18)}50%{box-shadow:0 0 0 5px rgba(180,35,24,0)}}
.whoknows{margin-top:10px;display:none;gap:10px;align-items:flex-start;background:#FFFBF1;border:1px solid #F2DCB0;border-radius:11px;padding:10px 12px}
.whoknows.show{display:flex}
.whoknows svg{width:16px;height:16px;color:#A16B00;flex:0 0 auto;margin-top:2px}
.whoknows .f{flex:1}
.whoknows label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#8A6400;font-weight:800;margin-bottom:4px}
.whoknows input{width:100%;border:1px solid #E7CE9A;border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff}
.choices{display:grid;gap:8px}
.choice{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line-strong);border-radius:11px;padding:11px 13px;background:#FCFEFD;cursor:pointer;font-size:13.8px;transition:all .12s}
.choice:hover{border-color:var(--c)}
.choice input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.choice .box,.choice .box *{pointer-events:none}
.choice:focus-within{outline:3px solid rgba(18,133,124,.32);outline-offset:2px}
.choice .box{width:19px;height:19px;border-radius:5px;border:1.5px solid #B9C8C4;background:#fff;display:grid;place-items:center;flex:0 0 auto;transition:all .12s}
.choice .box svg{width:12px;height:12px;color:#fff;opacity:0}
.choice.radio .box{border-radius:50%}
.choice.radio .box:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;opacity:0}
.choice.radio.checked .box:after{opacity:1}
.choice.checked{border-color:var(--c);background:var(--c-soft);box-shadow:0 0 0 2px var(--c-15)}
.choice.checked .box{background:var(--c);border-color:var(--c)}
.choice.checked .box svg{opacity:1}
.other-input{margin-top:8px;display:flex;align-items:center;gap:8px}
.other-input>span{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.other-input input{flex:1;border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:#fff;font-size:13.5px}
.q-bottom{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:#FBFCFC;padding:12px clamp(20px,3.4vw,36px);flex-wrap:wrap}
.q-bottom .qcount{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;margin-left:auto;margin-right:auto}
.q-bottom .qcount b{color:#43554F}
.q-bottom .skip{background:none;border:0;color:#7A8A85;font-size:12px;font-weight:650;cursor:pointer;padding:8px}
.q-bottom .skip:hover{color:var(--teal-700);text-decoration:underline}
.q-bottom .btn{min-width:110px}
.q-bottom .edit-return{color:var(--teal-700);font-size:12px;font-weight:700;text-decoration:none;background:none;border:0;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:5px}
@media(max-width:620px){
  .q-bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(10,45,38,.4)}
  .q-bottom .qcount{order:-1;width:100%;text-align:center;margin:0 0 2px}
  .q-bottom .skip{display:none}
  .q-bottom .btn{flex:1}
  .q-card{border-radius:16px}
  .q-layout{padding-bottom:130px}
}
.q-mobile-map{display:none}
@media(max-width:620px){
  .q-mobile-map{display:inline-flex}
  .q-card .q-top{padding-top:20px}
}
.edit-banner{background:var(--mint-100);border:1px solid var(--mint-200);color:var(--teal-900);border-radius:10px;padding:8px 12px;font-size:11.5px;display:flex;align-items:center;gap:8px;margin:0 0 12px;font-weight:650}
.edit-banner svg{width:14px;height:14px}

/* ============ drawer / modal ============ */
.drawer{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer .scrim{position:absolute;inset:0;background:rgba(9,30,26,.42);backdrop-filter:blur(2px)}
.drawer .sheet{position:relative;width:min(430px,100%);height:100%;background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.18);display:flex;flex-direction:column;animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head b{font-size:14px;flex:1}
.drawer-body{padding:16px 18px 30px;overflow:auto}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#52655F}
.icon-btn:hover{background:var(--mint-50)}
.icon-btn svg{width:16px;height:16px}
@media(max-width:620px){
  .drawer{justify-content:stretch;align-items:flex-end}
  .drawer .sheet{width:100%;height:min(82vh,720px);border-radius:20px 20px 0 0;animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
}
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .scrim{position:absolute;inset:0;background:rgba(9,30,26,.46)}
.modal .box{position:relative;background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .box h3{margin:0 0 8px;font-size:18px;letter-spacing:-.01em}
.modal .box p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.modal .box .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.modal-label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#53665F;font-weight:800;margin:14px 0 5px}
.modal-input{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;font:12px var(--mono);background:#FCFEFD;color:#233B34}
.modal-input:focus{border-color:var(--teal-500);outline:none;box-shadow:0 0 0 3px rgba(18,133,124,.12)}
@media(max-width:620px){
  .modal .box{padding:20px 18px}
  .modal .box .row{flex-direction:column;align-items:stretch}
  .modal .box .row .btn{width:100%}
}

/* ============ section done / review ============ */
.done-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
@media(max-width:860px){.done-grid{grid-template-columns:1fr}}
.big-done{background:linear-gradient(160deg,#fff,#F3FAF7);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,4vw,38px);box-shadow:var(--shadow);text-align:center}
.big-done .ring{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--mint-100);color:var(--teal-700);border:1px solid var(--mint-200)}
.big-done .ring svg{width:38px;height:38px}
.big-done h1{margin:0 0 6px;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em}
.big-done p{margin:0;color:var(--muted);font-size:14px}
.big-done .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.review-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.review-head h1{margin:0;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.03em}
.review-head p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.answer-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.answer-card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px}
.answer-card>summary::-webkit-details-marker{display:none}
.answer-card>summary .swatch{width:10px;height:34px;border-radius:5px;background:var(--c);flex:0 0 auto}
.answer-card>summary .t{flex:1;min-width:0}
.answer-card>summary .t b{display:block;font-size:14px;letter-spacing:-.01em}
.answer-card>summary .t span{font-size:11.5px;color:var(--muted)}
.answer-card>summary .count{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.answer-card>summary .chev{width:18px;height:18px;color:var(--soft);transition:transform .18s}
.answer-card[open]>summary .chev{transform:rotate(180deg)}
.answer-card .inner{border-top:1px solid var(--line);padding:6px 18px 16px}
.ans-row{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-bottom:1px solid #EDF2F0;align-items:start}
.ans-row:last-child{border-bottom:0}
.ans-row .qid{font-family:var(--mono);font-size:10.5px;color:#7D8C88;padding-top:2px}
.ans-row .qq{font-size:12px;color:#4B5E58;line-height:1.45;margin-bottom:4px}
.ans-row .aa{font-size:13.5px;color:#1D2E29;white-space:pre-wrap;word-break:break-word}
.ans-row .none{color:#9AA8A4;font-style:italic;font-size:12.5px}
.ans-row .edit{font-size:11px;font-weight:700;color:var(--teal-700);background:none;border:0;cursor:pointer;padding:2px 0;white-space:nowrap}
.ans-row .edit:hover{text-decoration:underline}
.marker-chip{display:inline-flex;align-items:center;gap:5px;background:var(--amber-bg);border:1px solid var(--amber-line);color:#7A5000;border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:750;margin:2px 0}
.marker-chip svg{width:11px;height:11px}
.sub-note{font-size:11px;color:var(--muted);margin-top:4px}
.gap-callout{background:#FFFBF1;border:1px solid #F0D49A;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.gap-callout b{display:flex;align-items:center;gap:7px;font-size:13px;color:#7A5000}
.gap-callout b svg{width:15px;height:15px}
.gap-callout p{margin:6px 0 10px;font-size:12.2px;color:#7C6130}
.gap-list{display:flex;flex-wrap:wrap;gap:6px}
.gap-list button{font-size:11px;border:1px solid #E7CE9A;background:#fff;color:#6E4B00;border-radius:7px;padding:4px 8px;cursor:pointer;font-weight:650}
.gap-list button:hover{background:#FFF3D6}
.signoff{padding:20px 22px}
.signoff h2{margin:0 0 4px;font-size:16px}
.signoff p{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.signoff .field{margin-bottom:12px}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:12.8px;color:#3A4E48;margin:4px 0 0;cursor:pointer}
.checkline input{width:18px;height:18px;accent-color:var(--teal-600);margin-top:1px;flex:0 0 auto}
.send-card{padding:20px 22px}
.send-card h2{margin:0 0 4px;font-size:16px}
.send-card .sub{margin:0 0 16px;color:var(--muted);font-size:12.5px}
.send-step{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.send-step:first-of-type{border-top:0;padding-top:2px}
.send-step .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.send-step .b b{display:block;font-size:13.2px}
.send-step .b p{margin:2px 0 9px;font-size:11.8px;color:var(--muted)}
.send-step .b .btn{margin:0 6px 6px 0}
.send-step .b .hint{font-size:10.8px;color:#8A9995;margin-top:4px}
.privacy-line{display:flex;gap:8px;align-items:flex-start;background:var(--mint-50);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:11.5px;color:#4A615A;margin-top:12px}
.privacy-line svg{width:15px;height:15px;flex:0 0 auto;color:var(--teal-600);margin-top:1px}
.sent-box{max-width:700px;margin:0 auto;text-align:center;padding:clamp(30px,5vw,60px) 0}
.sent-box .ring{width:90px;height:90px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--mint-100);border:1px solid var(--mint-200);color:var(--teal-700)}
.sent-box .ring svg{width:42px;height:42px}
.sent-box h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px);letter-spacing:-.03em}
.sent-box p{margin:0 auto;max-width:520px;color:var(--muted);font-size:14px}
.receipt{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-top:16px;padding:12px 18px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:var(--shadow)}
.receipt>div{text-align:left}
.receipt span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:800;margin-bottom:2px}
.receipt b{font-size:12.5px;letter-spacing:-.005em;word-break:break-word}
.session-card{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px auto 0;max-width:640px;box-shadow:var(--shadow)}
.session-card span{display:block;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:800;margin-bottom:2px}
.session-card b{font-size:12.5px;word-break:break-word}
@media(max-width:560px){.session-card{grid-template-columns:1fr 1fr;padding:14px}}
.sent-box .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.save-fab{display:none;align-items:center;gap:7px;border:1px solid #B6D9D1;background:rgba(255,255,255,.97);color:var(--teal-800);border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;box-shadow:0 12px 26px -14px rgba(10,45,38,.55);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:56;white-space:nowrap}
.save-fab svg{width:15px;height:15px}
.save-fab:active{transform:translateY(1px)}
@media(max-width:620px){
  .save-fab{display:inline-flex;position:fixed;right:12px;bottom:calc(96px + env(safe-area-inset-bottom))}
  .save-fab.review{bottom:calc(16px + env(safe-area-inset-bottom))}
  .field input,.field select,.field textarea,.q-textarea,.whoknows input,.other-input input,.modal-input{font-size:16px}
  .btn{min-height:44px}
  .assist{min-height:36px}
  .choice{min-height:44px}
  .sec-card{min-height:64px}
  .setup-summary{padding-bottom:calc(11px + env(safe-area-inset-bottom))}
}

/* ============ extras tables ============ */
.extra-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.extra-head h1{margin:0;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em}
.extra-head p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:620px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:760px}
table.grid th,table.grid td{padding:8px 9px;text-align:left;border-bottom:1px solid #EAF0EE;vertical-align:middle}
table.grid thead th{background:#F4F8F6;position:sticky;top:0;z-index:2;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#53665F;font-weight:800;white-space:nowrap}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tbody tr:nth-child(even){background:#FBFDFC}
table.grid td.store{font-weight:700;font-size:11.8px;white-space:nowrap;position:sticky;left:0;background:inherit;z-index:1}
table.grid input[type=text],table.grid select{width:100%;min-width:90px;border:1px solid var(--line-strong);border-radius:7px;padding:6px 7px;font-size:11.5px;background:#fff}
table.grid select{min-width:64px;padding:6px 4px}
.dev-chips{display:flex;gap:4px;flex-wrap:nowrap}
.dev-chip{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:#fff;cursor:pointer;white-space:nowrap}
.dev-chip input{width:11px;height:11px;accent-color:var(--teal-600);margin:0}
.docs-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin-top:8px}
@media(max-width:800px){.docs-grid{grid-template-columns:1fr}}
.doc-check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;font-size:12.4px;cursor:pointer;line-height:1.45}
.doc-check:hover{border-color:var(--teal-500)}
.doc-check input{width:17px;height:17px;accent-color:var(--teal-600);flex:0 0 auto;margin-top:1px}
.doc-check.on{background:var(--mint-50);border-color:#B6D9D1}
.raci-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:#52655F;margin:10px 0 14px}
.raci-legend b{color:#2F423E}
.raci-names{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:760px;margin-bottom:8px}
.raci-names input{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:6px;font-size:10.5px;background:#fff}
.raci-name-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:800;padding-left:2px}
.sop-owner-row{display:grid;grid-template-columns:64px minmax(0,1fr) 150px 170px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #EDF2F0}
.sop-owner-row:last-child{border-bottom:0}
.sop-owner-row .sid{font-family:var(--mono);font-size:10px;color:#7D8C88}
.sop-owner-row .nm{font-size:12px;line-height:1.4}
.sop-owner-row .prop{font-size:10.8px;color:var(--muted)}
.sop-owner-row input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;font-size:11.5px}
@media(max-width:760px){.sop-owner-row{grid-template-columns:54px 1fr;row-gap:4px}.sop-owner-row .prop{grid-column:2}.sop-owner-row input{grid-column:2}}
.back-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ============ reference ============ */
.ref-table{width:100%;border-collapse:collapse;font-size:12.4px;min-width:620px}
.ref-table th{text-align:left;background:#F4F8F6;padding:8px 10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#53665F;border-bottom:1px solid var(--line)}
.ref-table td{padding:9px 10px;border-bottom:1px solid #EDF2F0;vertical-align:top}
.ref-table tr:last-child td{border-bottom:0}
.ref-table .sid{font-family:var(--mono);font-size:10.5px;color:#6D7E79;white-space:nowrap}
.fed{display:flex;gap:3px;flex-wrap:wrap}
.fed span{font-family:var(--mono);font-size:9px;background:var(--mint-100);border:1px solid var(--mint-200);color:var(--teal-800);border-radius:4px;padding:1px 4px}

/* ============ coordinator ============ */
.drop{border:2px dashed var(--line-strong);border-radius:18px;background:#FBFDFC;padding:26px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--teal-500);background:var(--mint-50)}
.drop svg{width:32px;height:32px;color:var(--teal-600);margin:0 auto 8px}
.drop b{display:block;font-size:14px}
.drop p{margin:4px 0 12px;font-size:12px;color:var(--muted)}
.drop .btn{white-space:nowrap}
.coord-list{display:grid;gap:8px;margin-top:14px}
.resp-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.resp-row .av{width:34px;height:34px;border-radius:50%;background:var(--mint-100);color:var(--teal-800);font-size:11px;font-weight:800;display:grid;place-items:center}
.resp-row .nm{font-size:12.8px;font-weight:700;line-height:1.25}
.resp-row .meta{font-size:10.8px;color:var(--muted)}
.resp-row .cnt{font-size:10.5px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:620px){.resp-row{grid-template-columns:34px 1fr auto}.resp-row .cnt{display:none}}
.matrix{min-width:640px}
.matrix th.rot{font-size:9px;letter-spacing:.03em;text-transform:none;font-weight:700;color:#445851;max-width:90px;white-space:normal}
.matrix td.cell{text-align:center}
.mini-bar{width:44px;height:5px;border-radius:99px;background:#E7EEEC;margin:0 auto 4px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--teal-600);border-radius:99px}
.matrix .num{font-size:9.5px;color:#60726C;font-variant-numeric:tabular-nums}
.matrix .pri-gap{color:#9B2C20;font-weight:700}

/* ============ footer ============ */
.site-foot{border-top:1px solid var(--line);background:#fff;margin-top:40px}
.site-foot .in{max-width:1160px;margin:0 auto;padding:26px 22px;display:flex;flex-wrap:wrap;gap:18px 30px;align-items:flex-start;justify-content:space-between}
.site-foot .brand-mini{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.site-foot .brand-mini svg{width:28px;height:28px}
.site-foot .contact{font-size:12px;color:var(--muted);line-height:1.7}
.site-foot .contact b{color:var(--ink)}
.site-foot a{color:var(--teal-700);text-decoration:none}
.site-foot a:hover{text-decoration:underline}
.site-foot .fine{font-size:10.5px;color:#93A19D;max-width:520px;line-height:1.6}

/* ============ toasts ============ */
.toasts{position:fixed;right:18px;bottom:92px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--navy);color:#fff;border-radius:11px;padding:11px 14px;font-size:12.5px;box-shadow:0 16px 40px rgba(0,0,0,.25);animation:toastin .2s ease;display:flex;gap:8px;align-items:flex-start}
.toast svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;color:#8FE3D5}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:620px){.toasts{left:12px;right:12px;bottom:136px;max-width:none}}

/* ============ embedded preview notice ============ */
.embed-bar{background:#FFF8E6;border-top:1px solid #F0D49A;border-bottom:1px solid #F0D49A;color:#6B4E00;font-size:11.5px;line-height:1.5;padding:7px 16px;text-align:center}
.embed-bar b{font-weight:800}
.embed-bar button{background:none;border:0;padding:0 2px;font:inherit;font-weight:800;color:#7A5000;text-decoration:underline;cursor:pointer}
.embed-bar button:hover{color:#5A3B00}

/* ============ print ============ */
#print-root{display:none}
@media print{
  body{background:#fff;font-size:11.5pt}
  .topbar,.site-foot,.drawer,.modal,.toasts,.q-bottom,.setup-summary,.hero .band{display:none !important}
  #view{display:none !important}
  #print-root{display:block !important}
  .pr-page{page-break-after:always}
  .pr-page:last-child{page-break-after:auto}
  .pr-brand{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0C5953;padding-bottom:8px;margin-bottom:16px}
  .pr-brand b{font-size:16pt}
  .pr-brand span{font-size:9pt;color:#555}
  #print-root h1{font-size:20pt;margin:0 0 4px}
  #print-root h2{font-size:13pt;margin:16px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
  #print-root .pr-meta{font-size:9.5pt;color:#444;margin:0 0 12px}
  #print-root .pr-q{border-bottom:1px solid #e5e5e5;padding:7px 0;break-inside:avoid}
  #print-root .pr-q .id{font-size:8.5pt;color:#666;letter-spacing:.04em}
  #print-root .pr-q .q{font-size:10pt;color:#333;margin:1px 0}
  #print-root .pr-q .a{font-size:10.5pt;white-space:pre-wrap}
  #print-root .pr-marker{font-size:9pt;color:#7A5000}
  #print-root .pr-sign{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:10pt}
  #print-root .pr-line{border-top:1px solid #333;padding-top:4px;margin-top:26px}
  #print-root .pr-note{font-size:8.5pt;color:#666;margin-top:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

const sectionOf = (qid) => qid.split('-')[0];
const selectedSections = () => ORDER.filter((code) => state.selected.includes(code));
const currentSection = () => (state.current && SECTIONS[state.current]) || null;
const questionById = (qid) => {
  const sec = SECTIONS[sectionOf(qid)];
  return sec ? sec.questions.find((q) => q.id === qid) : null;
};
const groupOf = (qid) => {
  const sec = SECTIONS[sectionOf(qid)];
  if (!sec) return '';
  return (sec.groups.find((g) => g.questions.includes(qid)) || {}).title || '';
};
const estMinutes = (sec) => {
  const n = sec.questions.length;
  return `${Math.max(4, Math.round(n * 0.55))}–${Math.max(6, Math.round(n * 0.9))} min`;
};
const priorityCount = (sec) => sec.questions.filter((q) => q.pri).length;
const hasAnswer = (qid) => {
  const a = state.answers[qid];
  if (!a) return false;
  if (a.marker) return true;
  if (Array.isArray(a.value)) return a.value.length > 0 || (a.other && String(a.other).trim() !== '');
  return a.value != null && String(a.value).trim() !== '';
};
const answerStatus = (qid) => {
  const a = state.answers[qid];
  if (a && a.marker) return 'mark';
  return hasAnswer(qid) ? 'done' : 'todo';
};
function sectionStats(code) {
  const sec = SECTIONS[code];
  const total = sec.questions.length;
  let answered = 0;
  const priorityMissing = [];
  sec.questions.forEach((q) => {
    if (hasAnswer(q.id)) answered++;
    else if (q.pri) priorityMissing.push(q.id);
  });
  return { total, answered, pct: total ? Math.round((answered / total) * 100) : 0, priorityTotal: priorityCount(sec), priorityMissing };
}
function overallStats() {
  const codes = selectedSections();
  let total = 0, answered = 0, priorityMissing = 0;
  codes.forEach((code) => {
    const st = sectionStats(code);
    total += st.total;
    answered += st.answered;
    priorityMissing += st.priorityMissing.length;
  });
  return { total, answered, pct: total ? Math.round((answered / total) * 100) : 0, priorityMissing };
}
const firstUnanswered = (code) => {
  const idx = SECTIONS[code].questions.findIndex((q) => !hasAnswer(q.id));
  return idx < 0 ? 0 : idx;
};
const answeredInSection = (code) => sectionStats(code).answered;

    return `<button class="extra-card" data-action="extra:open" data-kind="${kind}" data-from="intro">
      <span class="tag">Optional · section extra</span><b>${esc(title)}</b><span>${esc(blurb)}</span>
    </button>`;
  }).join('');
  return `<div class="wrap narrow">
    <div style="padding-top:22px">
      <button class="btn-link" data-action="nav:setup" style="margin-bottom:14px">${icon('arrowL')} Change section</button>
      <div class="section-hero" style="${secVars(sec)}">
        <div class="stripe"></div>
        <div class="body">
          <span class="code">${sec.code} · ${esc(sec.short)}</span>
          <h1>${esc(sec.name)}</h1>
          <p class="who">${icon('users')}<span>${esc(sec.who)}</span></p>
          <p class="blurb">${esc(sec.blurb)}</p>
          <div class="intro-stats">
            <div class="intro-stat"><b>${st.total}</b><span>Questions</span></div>
            <div class="intro-stat"><b>${st.priorityTotal}</b><span>Priority</span></div>
            <div class="intro-stat"><b>${estMinutes(sec).replace(' min', '')}</b><span>Minutes</span></div>
            <div class="intro-stat"><b>${st.answered}</b><span>Answered</span></div>
          </div>
          <div class="intro-actions">
            <button class="btn lg" data-action="section:start" data-mode="continue">${st.answered ? 'Continue section' : 'Start section'} ${icon('arrowR')}</button>
            ${st.answered ? `<button class="btn ghost" data-action="section:start" data-mode="begin">Start from the beginning</button>` : ''}
            ${st.answered ? `<button class="btn ghost" data-action="review:open">Review & send</button>` : ''}
            <button class="btn ghost" data-action="session:save">${icon('bookmark')} Save &amp; resume</button>
            <button class="btn-link" data-action="map:open">${icon('grid')} Question map</button>
          </div>
          <div class="share-row">
            <button class="btn ghost sm" data-action="section:share" data-code="${sec.code}">${icon('share')} Share this section</button>
            <span class="tiny muted">2+ staff can answer this section — each submits their own name${API_AVAILABLE ? '; answers are saved to the coordinator dashboard.' : '.'}</span>
          </div>
        </div>
      </div>

      <div class="sop-panel" style="${secVars(sec)}">
        <h3>What these answers become</h3>
        <p>These SOPs and rules are drafted by Dependify from your section, then signed by their named owner.</p>
        <div class="sop-chips">${sec.sops.map((s) => `<span class="sop-chip">${icon('check')}${esc(s)}</span>`).join('')}</div>
      </div>

      <div class="sop-panel">
        <h3>Inside this section</h3>
        <p>Questions are grouped so you can move in the order you think. Jump to any group.</p>
        <div class="group-list">${groups}</div>
      </div>

      ${extras ? `<div style="margin-top:16px"><p class="eyebrow" style="margin-bottom:2px">Optional extras</p><div class="extra-cards">${extras}</div></div>` : ''}

      <div class="callout amber" style="margin-top:16px">${icon('alert')} <b>Priority questions unblock the launch.</b> They are marked ★. Non-priority answers are still valuable — skip nothing you can answer.</div>
    </div>
    ${foot()}
  </div>`;
}

/* ===== question ===== */
function renderQuestion() {
  const sec = currentSection();
  if (!sec) return renderSetup();
  const q = sec.questions[state.qIndex];
  if (!q) { state.screen = 'sectionDone'; return renderSectionDone(); }
  const ans = state.answers[q.id] || {};
  const marker = ans.marker || '';
  const st = sectionStats(sec.code);
  const last = state.qIndex === sec.questions.length - 1;
  const qType = q.type || 'text';
  let answerHTML = '';

  if (qType === 'text') {
    answerHTML = `<textarea class="q-textarea" id="q-answer" data-answer="${q.id}" placeholder="${marker ? 'Optional detail — anything you do know, or who to ask.' : 'Write your answer here — plain and honest.'}" aria-labelledby="q-title">${esc(ans.value || '')}</textarea>`;
  } else {
    const val = ans.value;
    answerHTML = `<div class="choices" role="${qType === 'radio' ? 'radiogroup' : 'group'}" aria-labelledby="q-title">` +
      q.options.map((opt) => {
        const checked = qType === 'radio' ? val === opt : Array.isArray(val) && val.includes(opt);
        return `<label class="choice ${qType === 'radio' ? 'radio' : ''} ${checked ? 'checked' : ''}">
          <input type="${qType === 'radio' ? 'radio' : 'checkbox'}" name="q-${q.id}" value="${esc(opt)}" ${checked ? 'checked' : ''} data-choice="${q.id}">
          <span class="box">${qType === 'radio' ? '' : icon('check')}</span>
          <span>${esc(opt)}</span>
        </label>`;
      }).join('') + `</div>`;
    if (q.other) {
      answerHTML += `<div class="other-input"><span>Other</span><input type="text" data-other="${q.id}" value="${esc(ans.other || '')}" placeholder="Please specify" aria-label="Other option for ${q.id}: please specify"></div>`;
    }
    answerHTML += `<textarea class="q-textarea q-note" data-note="${q.id}" style="min-height:76px;margin-top:12px;font-size:13.5px" placeholder="Add a note if it helps — names, exceptions, anything we should know.">${esc(ans.note || '')}</textarea>`;
  }

  const showWho = marker === 'dont-know' || marker === 'no-rule';
  const pct = Math.round(((state.qIndex + 1) / sec.questions.length) * 100);
  const priLeft = sec.questions.filter((x) => x.pri && !hasAnswer(x.id)).length;
  const sideDots = sec.questions.map((x, i) => {
    const s = answerStatus(x.id);
    return `<button class="q-dot ${s === 'done' ? 'done' : ''} ${s === 'mark' ? 'mark' : ''} ${i === state.qIndex ? 'cur' : ''}" data-action="q:jump" data-index="${i}" title="${x.id}${x.pri ? ' · priority' : ''}" aria-label="Question ${i + 1}">${i + 1}</button>`;
  }).join('');
  const sideSections = selectedSections().map((code) => {
    const s = SECTIONS[code];
    const sst = sectionStats(code);
    return `<button class="side-sec ${code === sec.code ? 'active' : ''}" data-action="section:switch" data-code="${code}" style="--c:${s.color}">
      <span class="d"></span><span>${esc(s.short)}</span><span class="pct">${sst.answered}/${sst.total}</span>
    </button>`;
  }).join('');
  const groupName = groupOf(q.id);

  return `<div class="wrap">
    <div class="q-layout">
      <aside class="q-side">
        <div class="q-side-card" style="${secVars(sec)}">
          <div class="side-head"><b>${sec.code} · ${esc(sec.short)}</b><span>${st.answered}/${st.total}</span></div>
          <div class="q-grid">${sideDots}</div>
          <div class="side-legend"><span><i style="background:var(--mint-200);border:1px solid #B6D9D1"></i>Answered</span><span><i style="background:#FFF3D6;border:1px solid #F0D49A"></i>Marked</span><span><i style="background:#F7FAF9;border:1px solid #DCE7E4"></i>Open</span></div>
        </div>
        <div class="q-side-card" style="${secVars(sec)}">
          <div class="side-head"><b>Your sections</b><span>${selectedSections().length}</span></div>
          <div class="side-sections">${sideSections}</div>
        </div>
        <div class="q-side-card">
          <div class="side-head"><b>Questions become rules</b></div>
          <p class="tiny muted" style="margin:0 0 8px">Every answer feeds the SOPs for this department. “Don't know” is still a useful answer.</p>
          <button class="btn-link" data-action="nav:reference">${icon('layers')} View the SOP register</button>
        </div>
      </aside>

      <div class="q-main" style="${secVars(sec)}">
        ${state.editReturn ? `<div class="edit-banner">${icon('file')} Editing from review — changes save as you type. <button class="btn-link" data-action="q:returnReview" style="margin-left:auto">Back to review ${icon('right')}</button></div>` : ''}
        <div class="q-card">
          <div style="height:4px;background:var(--mint-100)"><div style="height:100%;width:${pct}%;background:var(--c);transition:width .3s ease"></div></div>
          <div class="q-top">
            <div class="q-eyebrow">
              <span class="g">${esc(groupName)}</span><span class="sep"></span>
              <span class="q-id">${q.id}</span>
              ${q.pri ? '<span class="q-pri">★ Priority</span>' : ''}
              ${hasAnswer(q.id) ? '<span class="pill" style="margin-left:auto">Answered</span>' : ''}
            </div>
            <h2 class="q-title" id="q-title" tabindex="-1">${esc(q.q)}</h2>
            ${q.hint ? `<div class="q-hint"><b>Helpful to include:</b> ${esc(q.hint)}</div>` : ''}
          </div>
          <div class="q-answer">
            ${answerHTML}
            <div class="q-assist">
              <span class="lbl">Quick answer:</span>
              ${MARKERS.map(([key, label]) => `<button type="button" class="assist" data-action="q:marker" data-qid="${q.id}" data-marker="${key}" aria-pressed="${marker === key}">${esc(label)}</button>`).join('')}
              ${SpeechRec && qType === 'text' ? `<button type="button" class="assist voice" id="voiceBtn" data-action="q:voice" data-qid="${q.id}">${icon('mic')} Dictate</button>` : ''}
            </div>
            <div class="whoknows ${showWho ? 'show' : ''}" id="whoBox">
              ${icon('users')}
              <div class="f"><label for="whoInput">Who can answer this? (optional)</label><input id="whoInput" type="text" data-who="${q.id}" value="${esc(ans.who || '')}" placeholder="Name or role — e.g. IT lead, store manager"></div>
            </div>
          </div>
          <div class="q-bottom">
            <button class="btn ghost" data-action="q:back">${icon('arrowL')} Back</button>
            <button class="btn-link q-mobile-map" data-action="map:open">${icon('grid')} Map</button>
            <button class="skip" type="button" data-action="q:skip">Skip for now</button>
            <div class="qcount">Question <b>${state.qIndex + 1}</b> of ${sec.questions.length}${priLeft ? ` · <b>${priLeft}</b> priority open` : ''}</div>
            <button class="btn" data-action="q:next">${last ? 'Finish section' : 'Next'} ${icon('arrowR')}</button>
          </div>
          <button type="button" class="save-fab" data-action="session:save">${icon('bookmark')} Save &amp; resume later</button>
        </div>
      </div>
    </div>
    ${foot()}
  </div>`;
}

/* ===== section done ===== */
function renderSectionDone() {
  const sec = currentSection();
  if (!sec) return renderSetup();
  const st = sectionStats(sec.code);
  const codes = selectedSections();
  const pending = codes.filter((c) => c !== sec.code && sectionStats(c).answered < sectionStats(c).total);
  const nextCode = pending[0];
  const complete = st.answered === st.total;
  const extras = (sec.extras || []).map((kind) => {
    const map = {
      table1: ['Store technology snapshot', 'Optional — one row per store.'],
      sopOwners: ['Confirm SOP owners', 'Optional — correct the 24 proposed owners.'],
      raci: ['Starter RACI', 'Optional — correct the R / A / C / I grid.'],
      docs: ['Document request list', 'Optional — tick what you can share.']
    };
    const [title, blurb] = map[kind] || [kind, ''];
    return `<button class="extra-card" data-action="extra:open" data-kind="${kind}" data-from="done"><span class="tag">Optional</span><b>${esc(title)}</b><span>${esc(blurb)}</span></button>`;
  }).join('');
  return `<div class="wrap narrow" style="padding-top:26px;padding-bottom:40px">
    <div class="big-done">
      <div class="ring">${icon(complete ? 'check' : 'clock')}</div>
      <h1>${complete ? 'Section complete.' : 'You reached the end.'}</h1>
      <p>${esc(sec.name)} · ${st.answered} of ${st.total} answered${st.priorityMissing.length ? ` · ${st.priorityMissing.length} priority still open` : ' · every priority answered'}</p>
      ${st.priorityMissing.length ? `<div class="gap-callout" style="text-align:left;margin-top:18px"><b>${icon('alert')} ${st.priorityMissing.length} priority question${st.priorityMissing.length === 1 ? '' : 's'} still open</b><p>These unblock Month 1. Jump straight to them:</p><div class="gap-list">${st.priorityMissing.map((id) => `<button data-action="q:edit" data-qid="${id}">${id}</button>`).join('')}</div></div>` : ''}
      <div class="actions">
        <button class="btn" data-action="review:open">Review & send ${icon('arrowR')}</button>
        ${nextCode ? `<button class="btn ghost" data-action="section:switch" data-code="${nextCode}">Next section: ${esc(SECTIONS[nextCode].short)} ${icon('arrowR')}</button>` : ''}
        <button class="btn ghost" data-action="section:start" data-mode="begin">Keep editing</button>
        <button class="btn ghost" data-action="session:save">${icon('bookmark')} Save &amp; resume</button>
        <button class="btn ghost" data-action="section:share" data-code="${sec.code}">${icon('share')} Share section</button>
      </div>
      ${codes.length > 1 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px">${codes.map((c) => { const cst = sectionStats(c); return `<span class="pill ${cst.answered === cst.total ? '' : 'grey'}" style="--c:${SECTIONS[c].color}">${c} · ${cst.answered}/${cst.total}</span>`; }).join('')}</div>` : ''}
    </div>
    ${extras ? `<div style="margin-top:18px"><p class="eyebrow" style="margin-bottom:8px">Optional extras for this section</p><div class="extra-cards">${extras}</div></div>` : ''}
    <div class="callout" style="margin-top:18px">${icon('info')} Nothing has been sent yet. When you are ready, review your answers and download the response file to send to Dependify.</div>
    ${foot()}
  </div>`;
}

/* ===== extras ===== */
function renderExtra(kind) {
  const sec = currentSection();
  const back = state.extraFrom === 'review' ? `<button class="btn-link" data-action="review:open">${icon('arrowL')} Back to review</button>` : `<button class="btn-link" data-action="extra:back">${icon('arrowL')} Back</button>`;
  let body = '';
  let title = '';
  let blurb = '';

  if (kind === 'table1') {
    title = 'Store technology snapshot';
    blurb = 'Please complete one row per store, with the store manager if possible. Fill what you know — blanks are fine.';
    const rows = DATA.stores.map((store, i) => {
      const d = state.table1[store.name] || {};
      const dev = Array.isArray(d.devices) ? d.devices : [];
      return `<tr>
        <td class="store">${i + 1}. ${esc(store.name)}<br><span class="tiny muted">${esc(store.state)}</span></td>
        <td><input type="text" data-t1="${esc(store.name)}::internet" value="${esc(d.internet || '')}" placeholder="e.g. Fibre 10 Mbps"></td>
        <td><input type="text" data-t1="${esc(store.name)}::power" value="${esc(d.power || '')}" placeholder="e.g. Generator + inverter"></td>
        <td><div class="dev-chips">${['PC', 'Tablet', 'Phone'].map((x) => `<label class="dev-chip"><input type="checkbox" data-t1dev="${esc(store.name)}::${x}" ${dev.includes(x) ? 'checked' : ''}>${x}</label>`).join('')}</div></td>
        <td><input type="text" data-t1="${esc(store.name)}::printer" value="${esc(d.printer || '')}" placeholder="e.g. Thermal + scanner"></td>
        <td><select data-t1="${esc(store.name)}::wifi"><option value="">—</option><option value="Yes" ${d.wifi === 'Yes' ? 'selected' : ''}>Yes</option><option value="No" ${d.wifi === 'No' ? 'selected' : ''}>No</option><option value="Sometimes" ${d.wifi === 'Sometimes' ? 'selected' : ''}>Sometimes</option></select></td>
      </tr>`;
    }).join('');
    body = `<div class="table-wrap"><table class="grid">
      <thead><tr><th>Store</th><th>Internet type & speed</th><th>Power backup</th><th>Devices</th><th>Printer / scanner</th><th>Wi-Fi OK?</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="callout" style="margin-top:14px">${icon('info')} This table is optional. It helps IT plan devices, connectivity and offline fallbacks for each store.</div>`;
  }

  if (kind === 'sopOwners') {
    title = 'Confirm the SOP owners';
    blurb = 'Proposed owners are suggestions. Leave the proposed name to confirm it, or type a correction. Every row is saved automatically.';
    DATA.sopRegister.forEach((s) => { if (!Object.prototype.hasOwnProperty.call(state.sopOwners, s.id)) state.sopOwners[s.id] = s.owner; });
    body = DATA.sopRegister.map((s) => {
      const val = Object.prototype.hasOwnProperty.call(state.sopOwners, s.id) ? state.sopOwners[s.id] : s.owner;
      return `<div class="sop-owner-row">
        <span class="sid">${esc(s.id)}</span>
        <span class="nm">${esc(s.name)}<div class="fed">${s.fed.map((f) => `<span>${esc(f)}</span>`).join('')}</div></span>
        <span class="prop">Proposed: <b>${esc(s.owner)}</b></span>
        <input type="text" data-sop="${esc(s.id)}" value="${esc(val)}" aria-label="Confirmed owner for ${esc(s.id)}">
      </div>`;
    }).join('');
  }

  if (kind === 'raci') {
    title = 'Starter RACI — please correct it';
    blurb = 'R = does the work · A = accountable, signs off · C = consulted · I = informed. Fill in names for each role, then correct the grid.';
    const names = DATA.raci.roles.map((r, i) => `<div><div class="raci-name-lbl">${esc(r)}</div><input type="text" data-raciname="${i}" value="${esc(state.raci.names[i] == null ? r : state.raci.names[i])}" aria-label="Name for ${esc(r)}"></div>`).join('');
    const head = DATA.raci.roles.map((r, i) => `<th>${esc(state.raci.names[i] == null ? r : state.raci.names[i])}</th>`).join('');
    const rows = DATA.raci.activities.map((act, ai) => {
      const cells = DATA.raci.roles.map((r, ri) => {
        const key = ai + '-' + ri;
        const val = Object.prototype.hasOwnProperty.call(state.raci.cells, key) ? state.raci.cells[key] : '';
        return `<td><select data-raci="${key}" aria-label="${esc(act.name)} — ${esc(r)}">${['', 'R', 'A', 'C', 'I', 'A/R'].map((v) => `<option value="${v}" ${val === v ? 'selected' : ''}>${v || '—'}</option>`).join('')}</select></td>`;
      }).join('');
      return `<tr><td class="store" style="white-space:normal;min-width:150px">${esc(act.name)}</td>${cells}</tr>`;
    }).join('');
    body = `<div class="raci-legend"><span><b>R</b> does the work</span><span><b>A</b> accountable, signs off</span><span><b>C</b> consulted</span><span><b>I</b> informed</span></div>
    <div class="table-wrap"><div style="padding:10px 10px 6px;min-width:760px"><div class="raci-names">${names}</div><table class="grid" id="raciTable" style="min-width:760px"><thead><tr><th>Activity</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="back-row"><span class="small muted">The starter grid is pre-filled from the questionnaire. Change what is wrong; “—” means uninvolved.</span><button class="btn ghost sm" data-action="raci:reset">${icon('refresh')} Reset to starter</button></div>`;
  }

  if (kind === 'docs') {
    title = 'Document request list';
    blurb = 'Tick what you can send or point us to. Do not paste document contents into this form.';
    body = `<div class="docs-grid">${DATA.documents.map((d, i) => `<label class="doc-check ${state.docs[i] ? 'on' : ''}"><input type="checkbox" data-doc="${i}" ${state.docs[i] ? 'checked' : ''}><span>${esc(d)}</span></label>`).join('')}</div>
    <label class="field" style="margin-top:16px"><span>How will you share these, and with whom? <span class="opt">(optional)</span></span><textarea data-docnote rows="3" style="min-height:86px" placeholder="e.g. Google Drive folder to be shared with Tolulope; hard copies at head office.">${esc(state.docNote)}</textarea></label>
    <div class="callout amber">${icon('lock')} <b>Never email passwords, API keys or patient data.</b> Dependify will agree a secure channel for access details.</div>`;
  }

  return `<div class="wrap narrow" style="padding-top:24px;padding-bottom:40px">
    ${back}
    <div class="extra-head" style="margin-top:14px">
      <div><p class="eyebrow">${esc(sec ? sec.code + ' · Optional extra' : 'Optional extra')}</p><h1>${esc(title)}</h1><p>${esc(blurb)}</p></div>
    </div>
    ${body}
    <div class="back-row">
      <span class="small muted">Changes save in this tab automatically.</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" data-action="extra:back">Done — go back</button>
        ${state.extraFrom === 'review' ? `<button class="btn" data-action="review:open">Back to review ${icon('arrowR')}</button>` : `<button class="btn" data-action="review:open">Review & send ${icon('arrowR')}</button>`}
      </div>
    </div>
    ${foot()}
  </div>`;
}

/* ===== review ===== */
function answerText(qid) {
  const a = state.answers[qid];
  if (!a) return '';
  if (Array.isArray(a.value)) return a.value.join(', ') + (a.other && a.other.trim() ? ` — Other: ${a.other.trim()}` : '');
  return String(a.value == null ? '' : a.value);
}
function markerChip(marker) {
  if (!marker) return '';
  return `<span class="marker-chip">${icon('info')} ${esc(MARKER_LABEL[marker] || marker)}</span>`;
}
function renderReview() {
  const codes = selectedSections();
  if (!codes.length) return renderSetup();
  const st = overallStats();
  const gaps = codes.flatMap((code) => sectionStats(code).priorityMissing.map((id) => ({ id, code })));
  const resp = state.respondent;
  const cards = codes.map((code) => {
    const sec = SECTIONS[code];
    const sst = sectionStats(code);
    const rows = sec.questions.map((q) => {
      const a = state.answers[q.id] || {};
      const text = answerText(q.id);
      const has = hasAnswer(q.id);
      return `<div class="ans-row">
        <span class="qid">${q.id}</span>
        <div>
          <div class="qq">${esc(q.q)}</div>
          ${has ? `<div class="aa">${esc(text || '')}</div>${a.marker ? markerChip(a.marker) : ''}${a.who && a.who.trim() ? `<div class="sub-note">Who can answer: ${esc(a.who)}</div>` : ''}${a.note && a.note.trim() ? `<div class="sub-note">Note: ${esc(a.note)}</div>` : ''}` : '<div class="none">Not answered yet</div>'}
        </div>
        <button class="edit" data-action="review:edit" data-qid="${q.id}">Edit</button>
      </div>`;
    }).join('');
    const ex = (sec.extras || []).map((kind) => {
      const titleMap = { table1: 'Store technology snapshot', sopOwners: 'SOP owners', raci: 'Starter RACI', docs: 'Document request list' };
      let filled = '';
      if (kind === 'docs') { const n = Object.values(state.docs).filter(Boolean).length; filled = `${n} of ${DATA.documents.length} ticked`; }
      if (kind === 'table1') { const n = Object.keys(state.table1).filter((k) => state.table1[k] && Object.keys(state.table1[k]).length).length; filled = `${n} of ${DATA.stores.length} stores started`; }
      if (kind === 'sopOwners') {
        const n = Object.keys(state.sopOwners).length;
        const changed = DATA.sopRegister.filter((s) => state.sopOwners[s.id] && state.sopOwners[s.id] !== s.owner).length;
        filled = n ? `${n} owners recorded${changed ? ` · ${changed} changed` : ''}` : 'Not opened yet';
      }
      if (kind === 'raci') {
        let changed = 0;
        DATA.raci.activities.forEach((a, ai) => a.values.forEach((v, ri) => {
          const current = state.raci.cells[ai + '-' + ri] || '';
          if (current !== v) changed++;
        }));
        filled = changed ? `${changed} change${changed === 1 ? '' : 's'} from the starter grid` : 'Starter grid unchanged';
      }
